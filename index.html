    const compressImageToWebP = (file, maxWidth = 1000, quality = 0.82) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ratio = img.width > maxWidth ? maxWidth / img.width : 1;
            canvas.width = img.width * ratio;
            canvas.height = img.height * ratio;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/webp", quality));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

                    <div class="grid sm:grid-cols-2 gap-4">
                      <div>
                        <label class="block text-xs font-semibold mb-1">${t("Mobile Number *", "মোবাইল নাম্বার *")}</label>
                        <input required type="tel" value=${customerForm.phone} onInput=${e => setCustomerForm({ ...customerForm, phone: e.target.value })} class="w-full p-3 border border-[#E6DFD3] text-xs outline-none focus:border-[#822B17]" placeholder="01XXXXXXXXX" />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold mb-1">${t("Email (For Confirmation)", "ইমেইল (ঐচ্ছিক)")}</label>
                        <input type="email" value=${customerForm.email} onInput=${e => setCustomerForm({ ...customerForm, email: e.target.value })} class="w-full p-3 border border-[#E6DFD3] text-xs outline-none focus:border-[#822B17]" placeholder="you@example.com" />
                      </div>
                    </div>
                    <div>
                      <label class="block text-xs font-semibold mb-1">${t("Full Address *", "পূর্ণ ঠিকানা *")}</label>
                      <textarea required rows="2" value=${customerForm.address} onInput=${e => setCustomerForm({ ...customerForm, address: e.target.value })} class="w-full p-3 border border-[#E6DFD3] text-xs outline-none focus:border-[#822B17]" placeholder="House, Road, Area, District"></textarea>
                    </div>
                    <div class="grid grid-cols-2 gap-3 pt-1">
                      <button type="button" onClick=${() => setCustomerForm({ ...customerForm, zone: "inside" })} class="p-3 border text-xs font-semibold text-left transition ${customerForm.zone === "inside" ? "border-[#822B17] bg-[#822B17]/10 text-[#822B17]" : "border-[#E6DFD3]"}">
                        <div>Inside Dhaka</div>
                        <div class="font-bold mt-0.5">${isFreeDelivery ? "FREE" : `৳ ${settings.insideDhaka}`}</div>
                      </button>
                      <button type="button" onClick=${() => setCustomerForm({ ...customerForm, zone: "outside" })} class="p-3 border text-xs font-semibold text-left transition ${customerForm.zone === "outside" ? "border-[#822B17] bg-[#822B17]/10 text-[#822B17]" : "border-[#E6DFD3]"}">
                        <div>Outside Dhaka</div>
                        <div class="font-bold mt-0.5">${isFreeDelivery ? "FREE" : `৳ ${settings.outsideDhaka}`}</div>
                      </button>
                    </div>
                  </div>

                  <div class="md:col-span-5 bg-white p-6 border border-[#E6DFD3] flex flex-col justify-between">
                    <div>
                      <h3 class="text-sm font-bold uppercase tracking-wider border-b border-[#E6DFD3] pb-2.5 mb-4 text-[#822B17]">${t("Order Summary", "অর্ডার সামারি")}</h3>
                      <div class="space-y-3 max-h-60 overflow-y-auto">
                        ${cart.map(item => html`
                          <div key=${item.key} class="flex justify-between text-xs border-b border-[#E6DFD3]/60 pb-2">
                            <div>
                              <p class="font-semibold">${item.nameEn}</p>
                              <p class="text-neutral-500">${item.color} | Size: ${item.size} × ${item.qty}</p>
                            </div>
                            <span class="font-bold">৳ ${item.price * item.qty}</span>
                          </div>
                        `)}
                      </div>
                    </div>

                    <div class="border-t border-[#E6DFD3] pt-4 mt-4 space-y-2 text-xs">
                      <div class="flex justify-between"><span>Subtotal</span><span>৳ ${subtotal}</span></div>
                      <div class="flex justify-between"><span>Delivery</span><span>${deliveryCharge === 0 ? "FREE" : `৳ ${deliveryCharge}`}</span></div>
                      <div class="flex justify-between text-base font-extrabold text-[#822B17] pt-2 border-t border-[#E6DFD3]">
                        <span>Total Payable</span>
                        <span>৳ ${grandTotal}</span>
                      </div>
                      <button type="submit" class="w-full mt-4 py-3.5 bg-[#822B17] text-white text-xs font-bold uppercase tracking-widest hover:bg-[#682111] transition">
                        ${t("Confirm Order", "অর্ডার কনফার্ম করুন")}
                      </button>
                    </div>
                  </div>
                </form>
              `}
            </div>
          `}

          <!-- ===================================================================== -->
          <!-- VIEW 4: CUSTOMER PROFILE & ORDER TRACKING                             -->
          <!-- ===================================================================== -->
          ${view === "profile" && html`
            <div class="max-w-4xl mx-auto px-4 py-10 flex-1 w-full grid md:grid-cols-2 gap-8">
              <div class="bg-white p-6 border border-[#E6DFD3] space-y-4">
                <h2 class="text-base font-bold uppercase tracking-wide text-[#822B17]">${t("My Profile", "আমার প্রোফাইল")}</h2>
                <p class="text-xs text-neutral-500">Save your details for faster 1-click checkout.</p>
                <form onSubmit=${(e) => {
                  e.preventDefault();
                  try { localStorage.setItem("so_v4_customer_profile", JSON.stringify(customerProfile)); } catch {}
                  setCustomerForm({ ...customerProfile });
                  notify(t("Profile Saved!", "প্রোফাইল সেভ হয়েছে!"));
                }} class="space-y-3 text-xs">
                  <div>
                    <label class="block font-semibold mb-1">Full Name</label>
                    <input required value=${customerProfile.name} onInput=${e => setCustomerProfile({ ...customerProfile, name: e.target.value })} class="w-full p-2.5 border border-[#E6DFD3]" />
                  </div>
                  <div>
                    <label class="block font-semibold mb-1">Mobile Number</label>
                    <input required value=${customerProfile.phone} onInput=${e => setCustomerProfile({ ...customerProfile, phone: e.target.value })} class="w-full p-2.5 border border-[#E6DFD3]" />
                  </div>
                  <div>
                    <label class="block font-semibold mb-1">Email</label>
                    <input type="email" value=${customerProfile.email} onInput=${e => setCustomerProfile({ ...customerProfile, email: e.target.value })} class="w-full p-2.5 border border-[#E6DFD3]" />
                  </div>
                  <div>
                    <label class="block font-semibold mb-1">Default Delivery Address</label>
                    <textarea rows="2" value=${customerProfile.address} onInput=${e => setCustomerProfile({ ...customerProfile, address: e.target.value })} class="w-full p-2.5 border border-[#E6DFD3]"></textarea>
                  </div>
                  <button type="submit" class="w-full py-3 bg-[#822B17] text-white font-bold uppercase tracking-wider">
                    Save Profile
                  </button>
                </form>
              </div>

              <div class="bg-white p-6 border border-[#E6DFD3] space-y-4">
                <h2 class="text-base font-bold uppercase tracking-wide text-[#822B17]">${t("My Orders", "আমার অর্ডারসমূহ")}</h2>
                ${!customerProfile.phone ? html`
                  <p class="text-xs text-neutral-500">Enter and save your mobile number on the left to view your orders.</p>
                ` : html`
                  <div class="space-y-3">
                    ${orders.filter(o => o.customer.phone.includes(customerProfile.phone)).map(ord => html`
                      <div key=${ord.orderId} class="p-4 border border-[#E6DFD3] text-xs space-y-1">
                        <div class="flex justify-between font-bold">
                          <span class="text-[#822B17]">${ord.orderId}</span>
                          <span>${ord.status}</span>
                        </div>
                        <p class="text-neutral-500">${ord.dateFormatted}</p>
                        <p class="font-semibold">Total: ৳ ${ord.grandTotal}</p>
                      </div>
                    `)}
                  </div>
                `}
              </div>
            </div>
          `}

          ${view === "track" && html`
            <div class="max-w-xl mx-auto px-4 py-12 flex-1 w-full">
              <h2 class="text-lg font-bold uppercase tracking-wide text-[#822B17] mb-2">${t("Track Your Order", "অর্ডার ট্র্যাক করুন")}</h2>
              <input value=${trackInput} onInput=${e => setTrackInput(e.target.value)} placeholder="Enter Mobile Number or Order ID (e.g. SO-1234)" class="w-full p-3.5 border border-[#E6DFD3] bg-white text-xs outline-none focus:border-[#822B17] mb-6" />
              <div class="space-y-4">
                ${orders.filter(o => trackInput && (o.orderId.toLowerCase() === trackInput.toLowerCase() || o.customer.phone.includes(trackInput))).map(ord => html`
                  <div key=${ord.orderId} class="p-5 bg-white border border-[#E6DFD3] text-xs space-y-2">
                    <div class="flex justify-between font-bold text-sm">
                      <span class="text-[#822B17]">${ord.orderId}</span>
                      <span class="px-2.5 py-0.5 bg-[#822B17] text-white text-xs">${ord.status}</span>
                    </div>
                    <p>${ord.customer.name} • ${ord.customer.phone}</p>
                    <p class="font-bold">Total Payable: ৳ ${ord.grandTotal}</p>
                  </div>
                `)}
              </div>
            </div>
          `}

          <!-- ===================================================================== -->
          <!-- SLIDE-OUT SHOPPING BAG DRAWER                                         -->
          <!-- ===================================================================== -->
          ${cartOpen && html`
            <div class="fixed inset-0 z-50 bg-black/50 flex justify-end">
              <div class="w-full max-w-sm bg-[#FAF7F2] h-full p-6 flex flex-col justify-between text-[#1C1614]">
                <div>
                  <div class="flex justify-between items-center border-b border-[#E6DFD3] pb-4">
                    <h3 class="font-bold text-sm uppercase tracking-wider text-[#822B17]">Shopping Bag (${totalItemsCount})</h3>
                    <button onClick=${() => setCartOpen(false)}><${IconClose}/></button>
                  </div>
                  <div class="mt-4 space-y-4 max-h-[65vh] overflow-y-auto">
                    ${cart.length === 0 ? html`<p class="text-xs text-neutral-400 py-12 text-center">Your bag is empty.</p>` : cart.map((item, i) => html`
                      <div key=${item.key} class="flex gap-3 items-center border-b border-[#E6DFD3] pb-3 text-xs">
                        <img src=${item.image} class="w-14 h-18 object-cover bg-white border border-[#E6DFD3]" />
                        <div class="flex-1 min-w-0">
                          <p class="font-semibold truncate">${item.nameEn}</p>
                          <p class="text-neutral-500">${item.color} | Size: ${item.size}</p>
                          <p class="font-bold text-[#822B17] mt-1">৳ ${item.price} × ${item.qty}</p>
                        </div>
                        <button onClick=${() => setCart(cart.filter((_, idx) => idx !== i))} class="text-neutral-400 hover:text-red-600 px-1">✕</button>
                      </div>
                    `)}
                  </div>
                </div>
                ${cart.length > 0 && html`
                  <div class="border-t border-[#E6DFD3] pt-4">
                    <div class="flex justify-between font-bold text-sm mb-4">
                      <span>Subtotal</span>
                      <span class="text-[#822B17]">৳ ${subtotal}</span>
                    </div>
                    <button onClick=${() => { setCartOpen(false); setConfirmedOrder(null); setView("checkout"); }} class="w-full py-3.5 bg-[#822B17] text-white text-xs font-bold uppercase tracking-widest hover:bg-[#682111]">
                      Proceed to Checkout
                    </button>
                  </div>
                `}
              </div>
            </div>
          `}

          <!-- ===================================================================== -->
          <!-- WARM DARK CHARCOAL FOOTER (NO PUBLIC ADMIN LINK, WITH ADDRESS & 4 SOCIALS) -->
          <!-- ===================================================================== -->
          <footer class="mt-16 bg-[#231916] text-neutral-300 text-xs">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 py-12 grid grid-cols-1 md:grid-cols-3 gap-10">
              
              <!-- Column 1: Brand, Address & Essential Links -->
              <div class="space-y-3">
                <h3 class="text-white font-extrabold text-base tracking-wider uppercase">${settings.brandName}</h3>
                <p class="text-neutral-400">${t(settings.addressEn, settings.addressBn)}</p>
                <ul class="space-y-2 text-neutral-300 pt-1">
                  <li><button onClick=${() => setView("store")} class="hover:text-white">About ${settings.brandName}</button></li>
                  <li><button onClick=${() => setView("track")} class="hover:text-white">Return & Exchange Policy</button></li>
                  <li><button onClick=${() => setView("profile")} class="hover:text-white">Customer Profile</button></li>
                </ul>
              </div>

              <!-- Column 2: Customer Care & Track -->
              <div class="space-y-2.5">
                <p class="text-white font-bold uppercase tracking-wider">FOR ANY HELP YOU MAY CALL US AT</p>
                <p class="text-sm font-bold text-white">${settings.helpline}</p>
                <p class="text-neutral-400">Customer Service (10:00 AM - 10:00 PM)</p>
                <button onClick=${() => { setView("track"); window.scrollTo({ top: 0, behavior: "smooth" }); }} class="pt-1 inline-block text-white underline">
                  Track your order or request size exchange →
                </button>
              </div>

              <!-- Column 3: Follow Us (Facebook, YouTube, Instagram, LinkedIn) -->
              <div class="space-y-3">
                <p class="text-white font-bold uppercase tracking-wider">FOLLOW US</p>
                <p class="text-neutral-400">Stay updated on our latest arrivals and exclusive offers.</p>
                <div class="flex items-center gap-3 pt-1">
                  <a href=${settings.facebookUrl} target="_blank" rel="noreferrer" class="w-9 h-9 rounded-full bg-white/10 hover:bg-[#822B17] text-white flex items-center justify-center transition" title="Facebook">
                    <${IconFacebook}/>
                  </a>
                  <a href=${settings.youtubeUrl} target="_blank" rel="noreferrer" class="w-9 h-9 rounded-full bg-white/10 hover:bg-[#822B17] text-white flex items-center justify-center transition" title="YouTube">
                    <${IconYoutube}/>
                  </a>
                  <a href=${settings.instagramUrl} target="_blank" rel="noreferrer" class="w-9 h-9 rounded-full bg-white/10 hover:bg-[#822B17] text-white flex items-center justify-center transition" title="Instagram">
                    <${IconInstagram}/>
                  </a>
                  <a href=${settings.linkedinUrl} target="_blank" rel="noreferrer" class="w-9 h-9 rounded-full bg-white/10 hover:bg-[#822B17] text-white flex items-center justify-center transition" title="LinkedIn">
                    <${IconLinkedin}/>
                  </a>
                </div>
              </div>
            </div>

            <div class="bg-[#1C1412] text-neutral-400 py-4 px-4 text-center text-[11px] border-t border-white/10">
              Copyright © 2026 ${settings.brandName}. All Rights Reserved.
            </div>
          </footer>

          <!-- WARM BRAND FLOATING CHAT BUTTON -->
          <a
            href="https://wa.me/${settings.whatsapp}"
            target="_blank"
            rel="noreferrer"
            class="fixed bottom-6 right-6 z-40 w-12 h-12 rounded-full bg-[#822B17] text-white shadow-lg flex items-center justify-center hover:scale-105 transition"
            title="Chat with us"
          >
            <${IconChat}/>
          </a>
        </div>
      `;
    }

    render(html`<${SmartOutfitApp} />`, document.getElementById("root"));
  </script>
</body>
</html>
