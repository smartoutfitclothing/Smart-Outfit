    const compressImageToWebP = (file, maxWidth = 1000, quality = 0.82) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ratio = img.width > maxWidth ? maxWidth / img.width : 1;
            canvas.width = img.width * ratio;
            canvas.height = img.height * ratio;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/webp", quality));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");

        setAnalyticsData(prev => {

                  <div class="md:col-span-5 bg-white p-5 sm:p-6 border border-[#E6DFD3] flex flex-col justify-between">
                    <div>
                      <h3 class="text-sm font-bold uppercase tracking-wider border-b border-[#E6DFD3] pb-2.5 mb-4 text-[#7C2517]">Order Summary</h3>
                      <div class="space-y-3 max-h-60 overflow-y-auto">
                        ${cart.map(item => html`
                          <div key=${item.key} class="flex justify-between text-xs border-b border-[#E6DFD3]/60 pb-2">
                            <div>
                              <p class="font-semibold">${item.nameEn}</p>
                              <p class="text-neutral-500">${item.color} | Size: ${item.size} × ${item.qty}</p>
                            </div>
                            <span class="font-bold">৳ ${item.price * item.qty}</span>
                          </div>
                        `)}
                      </div>
                    </div>

                    <div class="border-t border-[#E6DFD3] pt-4 mt-4 space-y-2 text-xs">
                      <div class="flex justify-between"><span>Subtotal</span><span>৳ ${subtotal}</span></div>
                      <div class="flex justify-between"><span>Delivery</span><span>${deliveryCharge === 0 ? "FREE" : `৳ ${deliveryCharge}`}</span></div>
                      <div class="flex justify-between text-base font-extrabold text-[#7C2517] pt-2 border-t border-[#E6DFD3]">
                        <span>Total Payable</span>
                        <span>৳ ${grandTotal}</span>
                      </div>
                      <button type="submit" class="w-full mt-4 py-3.5 bg-[#7C2517] text-white text-xs font-bold uppercase tracking-widest hover:bg-[#5E1B10] transition">
                        Confirm Order
                      </button>
                    </div>
                  </div>
                </form>
              `}
            </div>
          `}

          <!-- ===================================================================== -->
          <!-- VIEW 4: PROFESSIONAL CUSTOMER PROFILE (LOGIN / SIGN UP / FORGOT PASS) -->
          <!-- Correction #11                                                        -->
          <!-- ===================================================================== -->
          ${view === "profile" && html`
            <div class="max-w-4xl mx-auto px-3 sm:px-4 py-10 flex-1 w-full">
              ${!loggedInCustomer ? html`
                <div class="max-w-md mx-auto bg-white border border-[#E6DFD3] p-6 sm:p-8 shadow-sm">
                  <div class="grid grid-cols-2 border-b border-[#E6DFD3] mb-6 text-xs font-extrabold uppercase tracking-wider">
                    <button
                      onClick=${() => setAuthTab("login")}
                      class="pb-3 border-b-2 transition ${authTab === "login" ? "border-[#7C2517] text-[#7C2517]" : "border-transparent text-neutral-400"}"
                    >
                      Login
                    </button>
                    <button
                      onClick=${() => setAuthTab("signup")}
                      class="pb-3 border-b-2 transition ${authTab === "signup" ? "border-[#7C2517] text-[#7C2517]" : "border-transparent text-neutral-400"}"
                    >
                      Sign Up
                    </button>
                  </div>

                  ${authTab === "login" && html`
                    <form onSubmit=${handleCustomerLogin} class="space-y-4 text-xs">
                      <div>
                        <label class="block font-semibold uppercase mb-1">Mobile Number or Email *</label>
                        <input
                          required
                          value=${loginForm.id}
                          onInput=${e => setLoginForm({ ...loginForm, id: e.target.value })}
                          placeholder="01XXXXXXXXX or Email"
                          class="w-full p-3 border border-[#E6DFD3] outline-none focus:border-[#7C2517]"
                        />
                      </div>
                      <div>
                        <label class="block font-semibold uppercase mb-1">Password *</label>
                        <input
                          required
                          type="password"
                          value=${loginForm.password}
                          onInput=${e => setLoginForm({ ...loginForm, password: e.target.value })}
                          placeholder="Enter password"
                          class="w-full p-3 border border-[#E6DFD3] outline-none focus:border-[#7C2517]"
                        />
                      </div>
                      <div class="text-right">
                        <button type="button" onClick=${() => setAuthTab("forgot")} class="font-bold text-[#7C2517] hover:underline">
                          Forgot Password?
                        </button>
                      </div>
                      <button type="submit" class="w-full py-3.5 bg-[#7C2517] text-white font-bold uppercase tracking-widest hover:bg-[#5E1B10] transition">
                        Login
                      </button>
                    </form>
                  `}

                  ${authTab === "signup" && html`
                    <form onSubmit=${handleCustomerSignup} class="space-y-3.5 text-xs">
                      <div>
                        <label class="block font-semibold uppercase mb-1">Full Name *</label>
                        <input
                          required
                          value=${signupForm.name}
                          onInput=${e => setSignupForm({ ...signupForm, name: e.target.value })}
                          placeholder="Enter your full name"
                          class="w-full p-2.5 border border-[#E6DFD3]"
                        />
                      </div>
                      <div>
                        <label class="block font-semibold uppercase mb-1">Mobile Number (Starts with 01) *</label>
                        <input
                          required
                          type="tel"
                          maxlength="11"
                          value=${signupForm.phone}
                          onInput=${e => setSignupForm({ ...signupForm, phone: cleanBdPhoneInput(e.target.value) })}
                          placeholder="01XXXXXXXXX"
                          class="w-full p-2.5 border border-[#E6DFD3] font-bold"
                        />
                      </div>
                      <div>
                        <label class="block font-semibold uppercase mb-1">Email *</label>
                        <input
                          required
                          type="email"
                          value=${signupForm.email}
                          onInput=${e => setSignupForm({ ...signupForm, email: e.target.value })}
                          placeholder="you@example.com"
                          class="w-full p-2.5 border border-[#E6DFD3]"
                        />
                      </div>
                      <div>
                        <label class="block font-semibold uppercase mb-1">Default Delivery Address *</label>
                        <textarea
                          required
                          rows="2"
                          value=${signupForm.address}
                          onInput=${e => setSignupForm({ ...signupForm, address: e.target.value })}
                          placeholder="House, Road, Area, District"
                          class="w-full p-2.5 border border-[#E6DFD3]"
                        ></textarea>
                      </div>
                      <div>
                        <label class="block font-semibold uppercase mb-1">Create Password *</label>
                        <input
                          required
                          type="password"
                          minlength="4"
                          value=${signupForm.password}
                          onInput=${e => setSignupForm({ ...signupForm, password: e.target.value })}
                          placeholder="Minimum 4 characters"
                          class="w-full p-2.5 border border-[#E6DFD3]"
                        />
                      </div>
                      <button type="submit" class="w-full py-3.5 bg-[#7C2517] text-white font-bold uppercase tracking-widest hover:bg-[#5E1B10] transition">
                        Create Account
                      </button>
                    </form>
                  `}

                  ${authTab === "forgot" && html`
                    <form onSubmit=${handleCustomerForgotPass} class="space-y-3.5 text-xs">
                      <h3 class="font-bold uppercase text-sm text-[#7C2517]">Reset Your Password</h3>
                      <p class="text-neutral-500">Enter your registered Mobile Number and Email to set a new password immediately.</p>
                      <div>
                        <label class="block font-semibold uppercase mb-1">Registered Mobile Number *</label>
                        <input
                          required
                          type="tel"
                          maxlength="11"
                          value=${forgotForm.phone}
                          onInput=${e => setForgotForm({ ...forgotForm, phone: cleanBdPhoneInput(e.target.value) })}
                          class="w-full p-2.5 border border-[#E6DFD3] font-bold"
                        />
                      </div>
                      <div>
                        <label class="block font-semibold uppercase mb-1">Registered Email *</label>
                        <input
                          required
                          type="email"
                          value=${forgotForm.email}
                          onInput=${e => setForgotForm({ ...forgotForm, email: e.target.value })}
                          class="w-full p-2.5 border border-[#E6DFD3]"
                        />
                      </div>
                      <div>
                        <label class="block font-semibold uppercase mb-1">New Password *</label>
                        <input
                          required
                          type="password"
                          minlength="4"
                          value=${forgotForm.newPassword}
                          onInput=${e => setForgotForm({ ...forgotForm, newPassword: e.target.value })}
                          class="w-full p-2.5 border border-[#E6DFD3]"
                        />
                      </div>
                      <button type="submit" class="w-full py-3 bg-[#7C2517] text-white font-bold uppercase tracking-widest">
                        Reset Password
                      </button>
                      <button type="button" onClick=${() => setAuthTab("login")} class="w-full text-center text-neutral-500 hover:underline pt-1">
                        ← Back to Login
                      </button>
                    </form>
                  `}
                </div>
              ` : html`
                <div class="grid md:grid-cols-2 gap-8">
                  <div class="bg-white p-6 border border-[#E6DFD3] space-y-4">
                    <div class="flex justify-between items-center border-b border-[#E6DFD3] pb-3">
                      <div>
                        <h2 class="text-base font-bold uppercase tracking-wide text-[#7C2517]">My Profile</h2>
                        <p class="text-xs text-neutral-500">Logged in as ${loggedInCustomer.phone}</p>
                      </div>
                      <button
                        onClick=${() => {
                          setLoggedInCustomer(null);
                          try { localStorage.removeItem("so_v4_logged_customer"); } catch {}
                          notify("Logged Out");
                        }}
                        class="px-3 py-1 border border-red-200 text-red-600 text-xs font-bold hover:bg-red-50"
                      >
                        Logout
                      </button>
                    </div>
                    <form onSubmit=${(e) => {
                      e.preventDefault();
                      const updatedList = customersList.map(c => c.phone === loggedInCustomer.phone ? loggedInCustomer : c);
                      setCustomersList(updatedList);
                      syncData("so_v4_customers", updatedList, "customers");
                      try { localStorage.setItem("so_v4_logged_customer", JSON.stringify(loggedInCustomer)); } catch {}
                      setCustomerForm({ ...customerForm, ...loggedInCustomer });
                      notify("Profile Updated!");
                    }} class="space-y-3 text-xs">
                      <div>
                        <label class="block font-semibold mb-1">Full Name</label>
                        <input required value=${loggedInCustomer.name} onInput=${e => setLoggedInCustomer({ ...loggedInCustomer, name: e.target.value })} class="w-full p-2.5 border border-[#E6DFD3]" />
                      </div>
                      <div>
                        <label class="block font-semibold mb-1">Mobile Number</label>
                        <input readonly value=${loggedInCustomer.phone} class="w-full p-2.5 border border-[#E6DFD3] bg-[#FAF7F2] text-neutral-500" />
                      </div>
                      <div>
                        <label class="block font-semibold mb-1">Email</label>
                        <input type="email" value=${loggedInCustomer.email} onInput=${e => setLoggedInCustomer({ ...loggedInCustomer, email: e.target.value })} class="w-full p-2.5 border border-[#E6DFD3]" />
                      </div>
                      <div>
                        <label class="block font-semibold mb-1">Default Delivery Address</label>
                        <textarea rows="2" value=${loggedInCustomer.address} onInput=${e => setLoggedInCustomer({ ...loggedInCustomer, address: e.target.value })} class="w-full p-2.5 border border-[#E6DFD3]"></textarea>
                      </div>
                      <button type="submit" class="w-full py-3 bg-[#7C2517] text-white font-bold uppercase tracking-wider">
                        Save Profile Changes
                      </button>
                    </form>
                  </div>

                  <div class="bg-white p-6 border border-[#E6DFD3] space-y-4">
                    <h2 class="text-base font-bold uppercase tracking-wide text-[#7C2517] border-b border-[#E6DFD3] pb-3">My Orders</h2>
                    <div class="space-y-3">
                      ${orders.filter(o => o.customer.phone.includes(loggedInCustomer.phone)).length === 0 ? html`
                        <p class="text-xs text-neutral-400 py-8 text-center">You haven't placed any orders yet.</p>
                      ` : orders.filter(o => o.customer.phone.includes(loggedInCustomer.phone)).map(ord => html`
                        <div key=${ord.orderId} class="p-4 border border-[#E6DFD3] text-xs space-y-1">
                          <div class="flex justify-between font-bold">
                            <span class="text-[#7C2517]">${ord.orderId}</span>
                            <span class="px-2 py-0.5 bg-[#7C2517] text-white text-[10px] uppercase">${ord.status}</span>
                          </div>
                          <p class="text-neutral-500">${ord.dateFormatted}</p>
                          <div class="flex justify-between items-center pt-1">
                            <span class="font-bold">Total: ৳ ${ord.grandTotal}</span>
                            <button onClick=${() => { setConfirmedOrder(ord); setView("checkout"); }} class="underline font-bold text-[#7C2517]">Invoice PDF</button>
                          </div>
                        </div>
                      `)}
                    </div>
                  </div>
                </div>
              `}
            </div>
          `}

          <!-- PUBLIC ORDER TRACKING (Open to everyone by Mobile Number or Order ID - Correction #11) -->
          ${view === "track" && html`
            <div class="max-w-xl mx-auto px-4 py-12 flex-1 w-full">
              <div class="bg-white p-6 sm:p-8 border border-[#E6DFD3]">
                <h2 class="text-lg font-bold uppercase tracking-wide text-[#7C2517] mb-1">Track Your Order</h2>
                <p class="text-xs text-neutral-500 mb-4">Enter your Mobile Number or Order ID (e.g. SO-1001) to view real-time status.</p>
                <input value=${trackInput} onInput=${e => setTrackInput(e.target.value)} placeholder="Enter Mobile Number or Order ID (e.g. SO-1001)" class="w-full p-3.5 border border-[#E6DFD3] bg-[#FAF7F2] text-xs outline-none focus:border-[#7C2517] mb-5" />
                <div class="space-y-4">
                  ${orders.filter(o => trackInput && (o.orderId.toLowerCase() === trackInput.trim().toLowerCase() || o.customer.phone.includes(trackInput.trim()))).map(ord => html`
                    <div key=${ord.orderId} class="p-4 bg-[#FAF7F2] border border-[#E6DFD3] text-xs space-y-2">
                      <div class="flex justify-between font-bold text-sm">
                        <span class="text-[#7C2517]">${ord.orderId}</span>
                        <span class="px-2.5 py-0.5 bg-[#7C2517] text-white text-xs">${ord.status}</span>
                      </div>
                      <p class="font-semibold">${ord.customer.name} • ${ord.customer.phone}</p>
                      <p class="text-neutral-600">${ord.items.map(i => `${i.nameEn} (${i.color}/${i.size}) x${i.qty}`).join(", ")}</p>
                      <div class="flex justify-between items-center pt-2 border-t border-[#E6DFD3]">
                        <span class="font-bold text-[#7C2517]">Total Payable: ৳ ${ord.grandTotal}</span>
                        <button onClick=${() => { setConfirmedOrder(ord); setView("checkout"); }} class="underline font-bold">Download Invoice</button>
                      </div>
                    </div>
                  `)}
                </div>
              </div>
            </div>
          `}

          <!-- ===================================================================== -->
          <!-- SLIDE-OUT SHOPPING CART DRAWER (Correction #14)                       -->
          <!-- ===================================================================== -->
          ${cartOpen && html`
            <div class="fixed inset-0 z-50 bg-black/50 flex justify-end" onClick=${() => setCartOpen(false)}>
              <div class="w-full max-w-sm bg-[#FAF7F2] h-full p-6 flex flex-col justify-between text-[#1C1614]" onClick=${e => e.stopPropagation()}>
                <div>
                  <div class="flex justify-between items-center border-b border-[#E6DFD3] pb-4">
                    <h3 class="font-bold text-sm uppercase tracking-wider text-[#7C2517]">Shopping Cart (${totalItemsCount})</h3>
                    <button onClick=${() => setCartOpen(false)}><${IconClose}/></button>
                  </div>
                  <div class="mt-4 space-y-4 max-h-[65vh] overflow-y-auto">
                    ${cart.length === 0 ? html`<p class="text-xs text-neutral-400 py-12 text-center">Your cart is empty.</p>` : cart.map((item, i) => html`
                      <div key=${item.key} class="flex gap-3 items-center border-b border-[#E6DFD3] pb-3 text-xs">
                        <img src=${item.image} class="w-14 h-18 object-cover bg-white border border-[#E6DFD3]" />
                        <div class="flex-1 min-w-0">
                          <p class="font-semibold truncate">${item.nameEn}</p>
                          <p class="text-neutral-500">${item.color} | Size: ${item.size}</p>
                          <p class="font-bold text-[#7C2517] mt-1">৳ ${item.price} × ${item.qty}</p>
                        </div>
                        <button onClick=${() => setCart(cart.filter((_, idx) => idx !== i))} class="text-neutral-400 hover:text-red-600 px-1">✕</button>
                      </div>
                    `)}
                  </div>
                </div>
                ${cart.length > 0 && html`
                  <div class="border-t border-[#E6DFD3] pt-4">
                    <div class="flex justify-between font-bold text-sm mb-4">
                      <span>Subtotal</span>
                      <span class="text-[#7C2517]">৳ ${subtotal}</span>
                    </div>
                    <button
                      onClick=${() => {
                        setCartOpen(false);
                        setConfirmedOrder(null);
                        setView("checkout");
                        fireMarketingEvent("InitiateCheckout", {
                          content_ids: cart.map(c => c.productId),
                          value: subtotal
                        });
                      }}
                      class="w-full py-3.5 bg-[#7C2517] text-white text-xs font-bold uppercase tracking-widest hover:bg-[#5E1B10]"
                    >
                      Proceed to Checkout
                    </button>
                  </div>
                `}
              </div>
            </div>
          `}

          <!-- INFO POLICY MODAL -->
          ${infoModal && html`
            <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick=${() => setInfoModal(null)}>
              <div class="bg-white border border-[#E6DFD3] p-6 max-w-lg w-full space-y-3 text-xs" onClick=${e => e.stopPropagation()}>
                <div class="flex justify-between items-center border-b border-[#E6DFD3] pb-2.5">
                  <h3 class="font-bold text-sm uppercase text-[#7C2517]">${infoModal.title}</h3>
                  <button onClick=${() => setInfoModal(null)}><${IconClose}/></button>
                </div>
                <p class="leading-relaxed text-neutral-700">${infoModal.body}</p>
              </div>
            </div>
          `}

          <!-- ===================================================================== -->
          <!-- 4-COLUMN MINIMAL FOOTER WITH 5 SOCIAL ICONS (Correction #5)           -->
          <!-- ===================================================================== -->
          <footer class="mt-16 bg-[#14110F] text-neutral-300 text-xs w-full">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 py-12 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
              
              <!-- Column 1: Brand Logo, Short Bio & 5 Social Media Icons (FB, YT, IG, TikTok, LinkedIn) -->
              <div class="flex flex-col items-center sm:items-start text-center sm:text-left space-y-3">
                <div class="flex items-center gap-2.5">
                  ${settings.logoUrl ? html`
                    <img src=${settings.logoUrl} class="w-9 h-9 object-contain rounded-full" />
                  ` : html`
                    <${BrandLogoSvg} sizeClass="w-9 h-9" />
                  `}
                  <span class="font-bold text-base tracking-wider uppercase text-white">${settings.brandName}</span>
                </div>
                <p class="text-neutral-400 leading-relaxed max-w-xs">
                  ${settings.footerBio || "One of the leading contemporary lifestyle & fashion brands in Bangladesh."}
                </p>
                <div class="flex items-center gap-2.5 pt-1">
                  <a href=${settings.facebookUrl} target="_blank" rel="noreferrer" class="w-8 h-8 rounded bg-[#1877F2] text-white flex items-center justify-center hover:opacity-90 transition" title="Facebook">
                    <${IconFacebook}/>
                  </a>
                  <a href=${settings.youtubeUrl} target="_blank" rel="noreferrer" class="w-8 h-8 rounded bg-[#FF0000] text-white flex items-center justify-center hover:opacity-90 transition" title="YouTube">
                    <${IconYoutube}/>
                  </a>
                  <a href=${settings.instagramUrl} target="_blank" rel="noreferrer" class="w-8 h-8 rounded bg-gradient-to-tr from-amber-500 via-pink-600 to-purple-600 text-white flex items-center justify-center hover:opacity-90 transition" title="Instagram">
                    <${IconInstagram}/>
                  </a>
                  <a href=${settings.tiktokUrl || "https://tiktok.com"} target="_blank" rel="noreferrer" class="w-8 h-8 rounded bg-neutral-800 border border-neutral-700 text-white flex items-center justify-center hover:opacity-90 transition" title="TikTok">
                    <${IconTiktok}/>
                  </a>
                  <a href=${settings.linkedinUrl} target="_blank" rel="noreferrer" class="w-8 h-8 rounded bg-[#0A66C2] text-white flex items-center justify-center hover:opacity-90 transition" title="LinkedIn">
                    <${IconLinkedin}/>
                  </a>
                </div>
              </div>

              <!-- Column 2: Account -->
              <div>
                <h4 class="footer-heading">Account</h4>
                <ul class="space-y-2.5 text-neutral-300 font-medium">
                  <li><button onClick=${() => { setView("profile"); window.scrollTo({ top: 0, behavior: "smooth" }); }} class="hover:text-white transition">My Account</button></li>
                  <li><button onClick=${() => { setView("track"); window.scrollTo({ top: 0, behavior: "smooth" }); }} class="hover:text-white transition">Track My Order</button></li>
                  <li><button onClick=${() => setCartOpen(true)} class="hover:text-white transition">Shopping Cart</button></li>
                  <li><button onClick=${() => setInfoModal({ title: "Complain Box", body: `For any complaint or size exchange support, please WhatsApp or call us directly at ${settings.whatsapp} with your Order ID.` })} class="hover:text-white transition">Complain Box</button></li>
                </ul>
              </div>

              <!-- Column 3: Information -->
              <div>
                <h4 class="footer-heading">Information</h4>
                <ul class="space-y-2.5 text-neutral-300 font-medium">
                  <li><button onClick=${() => setInfoModal({ title: `About ${settings.brandName}`, body: `${settings.brandName} is a premier lifestyle clothing brand in Bangladesh offering export-quality menswear, womenswear, kids wear, winter jackets, and value combo packs.` })} class="hover:text-white transition">About Us</button></li>
                  <li><button onClick=${() => setInfoModal({ title: "Return & Exchange Policy", body: settings.defaultDeliveryText || "Open Box Delivery Available. Easy 7-Day Size Exchange." })} class="hover:text-white transition">Return & Exchange Policy</button></li>
                  <li><button onClick=${() => setInfoModal({ title: "Privacy Policy", body: "Your contact details and delivery information are strictly kept confidential and used only for order delivery and support." })} class="hover:text-white transition">Privacy Policy</button></li>
                  <li><button onClick=${() => setInfoModal({ title: "Terms & Conditions", body: `All orders include Open Box Delivery inspection. Inside Dhaka delivery charge is ৳${settings.insideDhaka} and Outside Dhaka is ৳${settings.outsideDhaka}.` })} class="hover:text-white transition">Terms & Conditions</button></li>
                </ul>
              </div>

              <!-- Column 4: Talk To Us -->
              <div>
                <h4 class="footer-heading">Talk To Us</h4>
                <p class="text-neutral-400 mb-1">Got Questions? Call us</p>
                <a href="tel:${settings.whatsapp}" class="block text-lg font-extrabold text-white tracking-wide mb-3 hover:text-amber-400 transition">
                  ${settings.whatsapp}
                </a>
                <div class="space-y-2 text-neutral-300">
                  <p class="flex items-center gap-2">
                    <span>✉</span>
                    <span>${settings.adminEmail || "smartoutfitbd@gmail.com"}</span>
                  </p>
                  <p class="flex items-start gap-2 leading-relaxed">
                    <span>📍</span>
                    <span>${settings.addressEn}</span>
                  </p>
                </div>
              </div>
            </div>

            <div class="max-w-7xl mx-auto px-4 sm:px-6">
              <div class="border-t border-white/15 py-5 text-center text-[11px] text-neutral-400">
                © 2026 ${settings.brandName}. All Rights Reserved
              </div>
            </div>
          </footer>

          <!-- DIRECT 1-CLICK WHATSAPP FLOATING BUTTON (Correction #7: Auto formats 880 so chat opens immediately) -->
          <a
            href="https://wa.me/${formatWhatsAppNumber(settings.whatsapp)}?text=${encodeURIComponent("Hello SMART OUTFIT! I would like to know more about your products.")}"
            target="_blank"
            rel="noopener noreferrer"
            class="fixed bottom-5 right-5 z-40 w-12 h-12 rounded-full bg-[#25D366] hover:bg-[#1ebe57] text-white shadow-lg flex items-center justify-center hover:scale-105 transition"
            title="Message us on WhatsApp"
          >
            <${IconWhatsApp}/>
          </a>
        </div>
      `;
    }

    render(html`<${SmartOutfitApp} />`, document.getElementById("root"));
  </script>
</body>
</html>
