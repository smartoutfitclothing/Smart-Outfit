    const compressImageSafe = (file, maxWidth = 820, quality = 0.78) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ratio = img.width > maxWidth ? maxWidth / img.width : 1;
            canvas.width = Math.round(img.width * ratio);
            canvas.height = Math.round(img.height * ratio);
            const ctx = canvas.getContext("2d");
            ctx.fillStyle = "#FAF7F2";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const dataUrl = canvas.toDataURL("image/jpeg", quality);
            resolve(dataUrl);
          };
          img.onerror = () => resolve(event.target.result);
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

      let fbc = localStorage.getItem("so_meta_fbc") || "";
      try {
        const cookies = document.cookie.split(";").reduce((acc, c) => {
          const [k, v] = c.trim().split("=");
          if (k && v) acc[k] = v;
          return acc;
        }, {});
        if (cookies._fbp) fbp = cookies._fbp;
        if (cookies._fbc) fbc = cookies._fbc;

        const urlParams = new URLSearchParams(window.location.search);
        const fbclid = urlParams.get("fbclid");
        if (fbclid) {
          fbc = `fb.1.${Date.now()}.${fbclid}`;
          localStorage.setItem("so_meta_fbc", fbc);
        }
        if (!fbp) {
          fbp = `fb.1.${Date.now()}.${Math.floor(100000000 + Math.random() * 900000000)}`;
          localStorage.setItem("so_meta_fbp", fbp);
        }
      } catch {}
      return { fbp, fbc };
    };

    const getTrafficSource = () => {
      const p = new URLSearchParams(window.location.search);
      if (p.get("fbclid") || p.get("utm_source") === "facebook") return "Facebook Ad";
      if (p.get("gclid") || p.get("utm_source") === "google") return "Google Ad";
      if (p.get("ttclid") || p.get("utm_source") === "tiktok") return "TikTok Ad";
      if (document.referrer.includes("facebook.com")) return "Facebook";
      if (document.referrer.includes("google.com")) return "Google";
      return "Direct";
    };

    const getColorPhotos = (colorObj) => {
      if (!colorObj) return [];
      const list = [];
      if (Array.isArray(colorObj.images)) {
        colorObj.images.forEach(img => {
          if (typeof img === "string" && img.trim().length > 5) list.push(img.trim());
        });
      }
      if (typeof colorObj.image === "string" && colorObj.image.trim().length > 5 && !list.includes(colorObj.image.trim())) {
        list.unshift(colorObj.image.trim());
      }
      return list;
    };

    const getProductPrimaryPhoto = (prod) => {
      if (!prod || !Array.isArray(prod.colors)) return "";
      for (const c of prod.colors) {
        const photos = getColorPhotos(c);
        if (photos.length > 0) return photos[0];
      }
      return "";
    };

    const makeProductSlug = (prod) => {
      if (!prod) return "";
      const cleanName = String(prod.nameEn || "item")
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
      return `${cleanName}-${prod.id}`;
    };

    const getProductDirectAdUrl = (prod) => {
      if (!prod) return window.location.origin + window.location.pathname;
      const slug = makeProductSlug(prod);
      return `${window.location.origin}${window.location.pathname}?product=${encodeURIComponent(slug)}`;
    };

    const matchProductFromParam = (paramStr, list) => {
      if (!paramStr || !Array.isArray(list)) return null;
      const clean = decodeURIComponent(paramStr).trim();
      return list.find(p =>
        p.id === clean ||
        p.sku === clean ||
        makeProductSlug(p) === clean ||
        clean.endsWith(`-${p.id}`) ||
        clean.toLowerCase() === String(p.id).toLowerCase()
      ) || null;
    };

    // ============================================================================
    // 4. MAIN APPLICATION WITH 7-LAYER SECURITY SHIELD
    // ============================================================================
    function SmartOutfitApp() {
      const [view, setView] = useState("store"); // store | product | checkout | track | profile | adminLogin | admin

      const [products, setProducts] = useState(() => {

      const [adminTab, setAdminTab] = useState("dashboard");

      // Fetch Customer Public IP for Meta CAPI
      useEffect(() => {

      // Sync Helper (Strips any plain-text adminPin before saving settings)
      const syncData = (key, data, docName) => {
        const cleanData = { ...data };
        if (docName === "settings") delete cleanData.adminPin;
        try { localStorage.setItem(key, JSON.stringify(cleanData)); } catch (e) {}
        if (db && docName) {
          db.collection("smart_outfit_store").doc(docName).set({
            items: cleanData,

      const syncProductListPersistently = (updatedProducts, changedProduct = null, deletedId = null) => {
        try { localStorage.setItem("so_v4_products", JSON.stringify(updatedProducts)); } catch {}
        if (!db) return;
        db.collection("smart_outfit_store").doc("products").set({
          items: updatedProducts,
          updatedAt: new Date().toISOString()
        }).catch(() => {});

        if (changedProduct && changedProduct.id) {
          db.collection("smart_outfit_products").doc(String(changedProduct.id)).set({
            ...changedProduct,
            updatedAt: new Date().toISOString()
          }).catch(() => {});
        }
        if (deletedId) {
          db.collection("smart_outfit_products").doc(String(deletedId)).delete().catch(() => {});
        }
      };

      const setCleanBrowserUrl = (nextView, prod = null, cat = null) => {
        try {
          const basePath = window.location.pathname;
          if (nextView === "product" && prod) {
            const slug = makeProductSlug(prod);
            window.history.pushState({ view: "product", id: prod.id }, "", `${basePath}?product=${encodeURIComponent(slug)}`);
          } else if (nextView === "checkout") {
            window.history.pushState({ view: "checkout" }, "", `${basePath}#checkout`);
          } else if (nextView === "store" && cat && cat !== "ALL") {
            window.history.pushState({ view: "store", cat }, "", `${basePath}?category=${encodeURIComponent(cat)}`);
          } else if (nextView === "store") {
            window.history.pushState({ view: "store" }, "", basePath);
          }
        } catch {}
      };

      // Deep-Link & URL Listener
      useEffect(() => {
        const resolveUrlRoute = () => {
          const hash = window.location.hash || "";
          const params = new URLSearchParams(window.location.search);
          const prodParam = params.get("product");
          const catParam = params.get("category");

          if (hash === "#admin") {
            setView(adminAuthenticated ? "admin" : "adminLogin");
            return;
          }
          if (hash === "#checkout") {
            setView("checkout");
            return;
          }
          if (prodParam) {
            const matched = matchProductFromParam(prodParam, products);
            if (matched) {
              setSelectedProduct(matched);
              setSelectedColorIdx(0);
              setSelectedPhotoIdx(0);
              setSelectedSize("");
              setSizePromptWarning(false);
              setProductQty(1);
              setView("product");
              return;
            }
          }
          if (hash.startsWith("#product-")) {
            const pid = decodeURIComponent(hash.replace("#product-", ""));
            const matched = matchProductFromParam(pid, products);
            if (matched) {
              setSelectedProduct(matched);
              setSelectedColorIdx(0);
              setSelectedPhotoIdx(0);
              setSelectedSize("");
              setSizePromptWarning(false);
              setProductQty(1);
              setView("product");
              return;
            }
          }
          if (catParam && FIVE_MAIN_CATEGORIES.includes(catParam.toUpperCase())) {
            setActiveMainCat(catParam.toUpperCase());
            setActiveSubCat("ALL");
            setView("store");
          }
        };

        resolveUrlRoute();
        const onPopState = () => {
          if (window.location.hash === "#admin") {
            setView(adminAuthenticated ? "admin" : "adminLogin");
          } else if (window.location.hash === "#checkout") {
            setView("checkout");
          } else if (new URLSearchParams(window.location.search).get("product")) {
            resolveUrlRoute();
          } else {
            setView("store");
            setTimeout(() => window.scrollTo({ top: savedScrollY, behavior: "instant" }), 30);
          }
        };
        const onHashChange = () => {
          if (window.location.hash === "#admin") {
            setView(adminAuthenticated ? "admin" : "adminLogin");
          } else if (window.location.hash === "#checkout") {
            setView("checkout");
          }
        };
        window.addEventListener("popstate", onPopState);
        window.addEventListener("hashchange", onHashChange);
        return () => {
          window.removeEventListener("popstate", onPopState);
          window.removeEventListener("hashchange", onHashChange);
        };
      }, [adminAuthenticated, products]);

      // Dynamic Title & Favicon
      useEffect(() => {
        if (view === "product" && selectedProduct) {
          document.title = `${selectedProduct.nameEn} | ${settings.brandName || "SMART OUTFIT"}`;
        } else {
          document.title = settings.brandName || "SMART OUTFIT";
        }
        const fav = document.getElementById("dynamic-favicon");
        if (fav && (settings.faviconUrl || settings.logoUrl)) {
          fav.href = settings.faviconUrl || settings.logoUrl;
        }
      }, [settings.brandName, settings.faviconUrl, settings.logoUrl, view, selectedProduct]);

      // Initialize Meta Pixel & Google Analytics 4
      useEffect(() => {
        if (settings.metaPixelId && !window.fbq) {
          !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
          n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
          t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
          document,'script','https://connect.facebook.net/en_US/fbevents.js');
          window.fbq('init', settings.metaPixelId);
        }
        const gaId = settings.ga4Id || FIREBASE_CONFIG.measurementId;
        if (gaId && !window.gtag) {
          const s = document.createElement("script");
          s.async = true;
          s.src = `https://www.googletagmanager.com/gtag/js?id=${gaId}`;
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function(){window.dataLayer.push(arguments);};
          window.gtag('js', new Date());
          window.gtag('config', gaId);

      }, [settings.metaPixelId, settings.ga4Id, settings.googleAdsId]);

      // Marketing & CAPI Event Dispatcher
      const fireMarketingEvent = async (eventName, payload = {}, userInfo = {}) => {
        const eventId = `evt_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
        const source = getTrafficSource();
        const { fbp, fbc } = getMetaCookiesAndClickId();

        setAnalyticsData(prev => {
          const next = { ...prev };
          if (eventName === "PageView" && !sessionStorage.getItem("so_session_counted")) {
            sessionStorage.setItem("so_session_counted", "1");
            next.totalVisitors = (next.totalVisitors || 0) + 1;
          }
          if (eventName === "ViewContent" && payload.content_ids?.[0]) {
            const pid = payload.content_ids[0];
            next.productViews = { ...(next.productViews || {}), [pid]: ((next.productViews?.[pid] || 0) + 1) };
          }
          if (eventName === "AddToCart") next.addToCartCount = (next.addToCartCount || 0) + 1;
          if (eventName === "InitiateCheckout") next.checkoutCount = (next.checkoutCount || 0) + 1;

          next.recentEvents = [
            {
              time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }),
              event: eventName,
              detail: payload.content_name || payload.order_id || "Storefront Visit",
              value: payload.value ? `৳${payload.value}` : "-",
              source
            },
            ...(next.recentEvents || []).slice(0, 35)
          ];
          syncData("so_v4_analytics", next, "analytics");
          return next;
        });

        if (window.fbq && settings.metaPixelId) {
          if (userInfo.phone) {

          }
          window.fbq("track", eventName, {
            content_type: "product",
            currency: "BDT",
            ...payload

        }

        if (settings.metaPixelId && settings.metaCapiToken) {
          try {
            const userData = {

            const activeName = userInfo.name || loggedInCustomer?.name || customerForm?.name || "";

            if (activePhone && activePhone.length >= 11) {
              userData.ph = [await sha256LowerHash(formatWhatsAppNumber(activePhone))];
              userData.external_id = [await sha256LowerHash(formatWhatsAppNumber(activePhone))];
            }
            if (activeEmail) userData.em = [await sha256LowerHash(activeEmail)];
            if (activeName) userData.fn = [await sha256LowerHash(activeName)];

            const body = {
              data: [{
                event_name: eventName,
                event_time: Math.floor(Date.now() / 1000),
                event_id: eventId,
                action_source: "website",
                event_source_url: window.location.href,
                user_data: userData,
                custom_data: {
                  content_type: "product",
                  currency: "BDT",
                  value: Number(payload.value) || 0,
                  content_ids: payload.content_ids || [],
                  content_name: payload.content_name || "",
                  num_items: payload.num_items || 1
                }
              }]
            };
            if (settings.metaTestCode && settings.metaTestCode.trim()) {
              body.test_event_code = settings.metaTestCode.trim();
            }
            fetch(`https://graph.facebook.com/v19.0/${settings.metaPixelId.trim()}/events?access_token=${settings.metaCapiToken.trim()}`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(body)
            }).catch(() => {});
          } catch {}
        }

        if (window.gtag) {
          const gaEventMap = { ViewContent: "view_item", AddToCart: "add_to_cart", InitiateCheckout: "begin_checkout", Purchase: "purchase" };
          window.gtag("event", gaEventMap[eventName] || eventName, {
            currency: "BDT",
            value: Number(payload.value) || 0,
            transaction_id: payload.order_id || undefined
          });
        }
      };

      const handleTestMetaConnection = async () => {
        if (!settings.metaPixelId || !settings.metaCapiToken) {
          setCapiTestStatus("⚠️ Please enter both Meta Pixel ID and Meta CAPI Access Token first.");
          return;
        }
        setCapiTestStatus("⏳ Sending live test event to Meta Graph API...");
        try {
          const { fbp, fbc } = getMetaCookiesAndClickId();
          const testEventId = "test_" + Date.now();
          if (window.fbq) {
            window.fbq("track", "PageView", {}, { eventID: testEventId });
          }
          const userData = {
            client_user_agent: navigator.userAgent,
            country: [await sha256LowerHash("bd")]
          };
          if (clientIp) userData.client_ip_address = clientIp;
          if (fbp) userData.fbp = fbp;
          if (fbc) userData.fbc = fbc;

          const body = {
            data: [{
              event_name: "ViewContent",
              event_time: Math.floor(Date.now() / 1000),
              event_id: testEventId,
              action_source: "website",
              event_source_url: window.location.href,
              user_data: userData,
              custom_data: {
                content_type: "product",
                currency: "BDT",

                content_name: "SMART OUTFIT Live Connection Test"
              }

          };
          if (settings.metaTestCode && settings.metaTestCode.trim()) {

          const res = await fetch(`https://graph.facebook.com/v19.0/${settings.metaPixelId.trim()}/events?access_token=${settings.metaCapiToken.trim()}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },

          });
          const data = await res.json();
          if (data.events_received) {

            notify("Meta CAPI Test Successful!");
          } else {
            setCapiTestStatus(`❌ Meta Error: ${data.error?.message || "Invalid Pixel ID or Token"}`);

          setCapiTestStatus(`❌ Network Error: ${err.message}`);

      useEffect(() => {
        fireMarketingEvent("PageView", {});

      // SECURITY LAYER 1: Public Storefront ONLY loads Products & Public Settings (NEVER bulk-fetches Orders or Customer lists!)
      useEffect(() => {
        if (!db) return;

        Promise.all([
          db.collection("smart_outfit_store").doc("products").get().catch(() => null),
          db.collection("smart_outfit_products").get().catch(() => null)
        ]).then(([mainDoc, indivSnap]) => {
          let baseList = [];
          if (mainDoc && mainDoc.exists && Array.isArray(mainDoc.data()?.items)) {
            baseList = mainDoc.data().items;
          }
          const indivMap = new Map();
          if (indivSnap && !indivSnap.empty) {
            indivSnap.docs.forEach(d => {
              const item = d.data();
              if (item && item.id) indivMap.set(item.id, item);
            });
          }
          if (baseList.length > 0 || indivMap.size > 0) {
            const merged = baseList.map(p => {
              const ind = indivMap.get(p.id);
              if (ind && getProductPrimaryPhoto(ind) && !getProductPrimaryPhoto(p)) {
                return ind;
              }
              return ind ? { ...p, ...ind } : p;
            });
            indivMap.forEach((val, key) => {
              if (!merged.some(m => m.id === key)) merged.unshift(val);

          let matchedOrder = null;
          if (db) {
            const docSnap = await db.collection("orders").doc(cleanCode).get();
            if (docSnap.exists) {
              const data = docSnap.data();
              if (data?.customer?.phone === cleanPhone || data?.customerPhone === cleanPhone) {

            } else {
              // Fallback case-insensitive match on orderId

        if (db) {
          if (isValidBdMobile(inputId)) {
            const docSnap = await db.collection("smart_outfit_customers").doc(inputId).get().catch(() => null);
            if (docSnap && docSnap.exists) found = docSnap.data();

            const qSnap = await db.collection("smart_outfit_customers").where("email", "==", inputId).get().catch(() => null);
            if (qSnap && !qSnap.empty) found = qSnap.docs[0].data();
          }

        if (!found || (found.passwordHash !== passHash && found.password !== loginForm.password)) {
          notify("Incorrect Mobile/Email or Password!");
          return;

        const safeSessionProfile = { ...found };
        delete safeSessionProfile.passwordHash;

                          class="text-xs font-bold text-[#7C2517] hover:underline"
                        >
                          ← Continue Shopping
                        </button>
                        <button
                          type="button"
                          onClick=${() => {
                            setLoggedInCustomer(null);
                            setMyCustomerOrders([]);
                            try { localStorage.removeItem("so_v4_logged_customer"); } catch {}
                            notify("Logged Out");
                          }}
                          class="px-3.5 py-1.5 border border-red-200 text-red-600 text-xs font-bold hover:bg-red-50"
                        >
                          Logout
                        </button>
                      </div>
                    ` : html`
                      <!-- EDIT MODE -->
                      <form onSubmit=${async (e) => {
                        e.preventDefault();
                        if (db && loggedInCustomer.phone) {
                          await db.collection("smart_outfit_customers").doc(loggedInCustomer.phone).set(loggedInCustomer, { merge: true }).catch(() => {});
                        }
                        try { localStorage.setItem("so_v4_logged_customer", JSON.stringify(loggedInCustomer)); } catch {}
                        setCustomerForm(prev => ({ ...prev, ...loggedInCustomer }));
                        setIsEditingProfile(false);
                        notify("✓ Profile Updated Successfully!");
                      }} class="space-y-3.5 text-xs">
                        <div class="flex justify-between items-center border-b border-[#E6DFD3] pb-3">
                          <h3 class="font-bold text-sm uppercase text-[#7C2517]">Edit Profile</h3>
                          <button type="button" onClick=${() => setIsEditingProfile(false)} class="text-neutral-500 font-bold">Cancel ✕</button>
                        </div>

                        <div class="flex items-center gap-3">
                          ${loggedInCustomer.avatar ? html`
                            <img src=${loggedInCustomer.avatar} class="w-12 h-12 rounded-full object-cover border border-[#7C2517]" />
                          ` : html`
                            <div class="w-12 h-12 rounded-full bg-[#7C2517] text-white flex items-center justify-center font-bold text-base">
                              ${(loggedInCustomer.name || "U").charAt(0)}
                            </div>
                          `}
                          <label class="px-3 py-1.5 bg-[#FAF7F2] border border-[#E6DFD3] font-semibold cursor-pointer hover:border-[#7C2517]">
                            Change Photo
                            <input
                              type="file"
                              accept="image/*"
                              class="hidden"
                              onChange=${async (e) => {
                                if (e.target.files?.[0]) {
                                  const img = await compressImageSafe(e.target.files[0], 300, 0.8);
                                  setLoggedInCustomer({ ...loggedInCustomer, avatar: img });
                                }
                              }}
                            />
                          </label>
                        </div>

                        <div>
                          <label class="block font-semibold mb-1">Full Name</label>
                          <input required value=${loggedInCustomer.name} onInput=${e => setLoggedInCustomer({ ...loggedInCustomer, name: e.target.value })} class="w-full p-2.5 border border-[#E6DFD3]" />
                        </div>
                        <div>
                          <label class="block font-semibold mb-1">Mobile Number</label>
                          <input readonly value=${loggedInCustomer.phone} class="w-full p-2.5 border border-[#E6DFD3] bg-[#FAF7F2] text-neutral-500" />
                        </div>
                        <div>
                          <label class="block font-semibold mb-1">Email</label>
                          <input type="email" value=${loggedInCustomer.email} onInput=${e => setLoggedInCustomer({ ...loggedInCustomer, email: e.target.value })} class="w-full p-2.5 border border-[#E6DFD3]" />
                        </div>
                        <div>
                          <label class="block font-semibold mb-1">Default Delivery Address</label>
                          <textarea rows="2" value=${loggedInCustomer.address} onInput=${e => setLoggedInCustomer({ ...loggedInCustomer, address: e.target.value })} class="w-full p-2.5 border border-[#E6DFD3]"></textarea>
                        </div>
                        <div class="flex gap-2 pt-2">
                          <button type="button" onClick=${() => setIsEditingProfile(false)} class="flex-1 py-2.5 border border-[#E6DFD3] font-semibold">
                            Cancel
                          </button>
                          <button type="submit" class="flex-1 py-2.5 bg-[#7C2517] text-white font-bold uppercase tracking-wider">
                            Save Changes
                          </button>
                        </div>
                      </form>
                    `}
                  </div>

                  <!-- Right Column: Customer Full Order History & Invoice Download (Protected Inside Profile Login) -->
                  <div class="md:col-span-7 bg-white p-6 border border-[#E6DFD3] space-y-4">
                    <h2 class="text-base font-bold uppercase tracking-wide text-[#7C2517] border-b border-[#E6DFD3] pb-3">My Order History</h2>
                    <div class="space-y-3 max-h-[450px] overflow-y-auto pr-1">
                      ${myCustomerOrders.length === 0 ? html`
                        <p class="text-xs text-neutral-400 py-12 text-center">You haven't placed any orders yet.</p>
                      ` : myCustomerOrders.map(ord => html`
                        <div key=${ord.orderId} class="p-4 border border-[#E6DFD3] bg-[#FAF7F2]/60 text-xs space-y-1.5">
                          <div class="flex justify-between font-bold">
                            <span class="text-[#7C2517] text-sm">${ord.orderId}</span>
                            <span class="px-2.5 py-0.5 bg-[#7C2517] text-white text-[10px] uppercase">${ord.status}</span>
                          </div>
                          <p class="text-neutral-500">${ord.dateFormatted}</p>
                          <p class="text-[#1C1614] font-medium">${(ord.items || []).map(i => `${i.nameEn} (${i.color}/${i.size}) ×${i.qty}`).join(", ")}</p>
                          <div class="flex justify-between items-center pt-2 border-t border-[#E6DFD3]">
                            <span class="font-extrabold text-[#1C1614]">Total: ৳ ${ord.grandTotal}</span>
                            <button onClick=${() => { setConfirmedOrder(ord); setView("checkout"); }} class="underline font-bold text-[#7C2517]">Download Invoice PDF</button>
                          </div>
                        </div>
                      `)}
                    </div>
                  </div>
                </div>
              `}
            </div>
          `}

          <!-- ===================================================================== -->
          <!-- VIEW 5: STRICT DUAL-LOCK ORDER TRACKING (HALF-MASKED, PARCEL STATUS)  -->
          <!-- Security Layer 2: Requires BOTH Full Order ID + Full 11-Digit Mobile  -->
          <!-- ===================================================================== -->
          ${view === "track" && html`
            <div class="max-w-lg mx-auto px-4 py-12 flex-1 w-full">
              <div class="bg-white p-6 sm:p-8 border border-[#E6DFD3] shadow-sm">
                <div class="flex items-center gap-2 text-[#7C2517] mb-1">
                  <${IconShield}/>
                  <h2 class="text-lg font-bold uppercase tracking-wide">Track Your Parcel</h2>
                </div>
                <p class="text-xs text-neutral-500 mb-5 leading-relaxed">
                  নিরাপত্তার স্বার্থে আপনার সম্পূর্ণ <strong>Order ID</strong> এবং অর্ডারে ব্যবহৃত <strong>১১ ডিজিটের মোবাইল নাম্বার</strong> দুটোই নিচে লিখে স্ট্যাটাস চেক করুন।
                </p>

                <form onSubmit=${handleStrictOrderTrack} class="space-y-4 text-xs">
                  <div>
                    <label class="block font-bold uppercase tracking-wider text-neutral-600 mb-1">Order ID / Code *</label>
                    <input
                      required
                      value=${trackOrderCode}
                      onInput=${e => setTrackOrderCode(e.target.value)}
                      placeholder="e.g. SO-1001"
                      class="w-full p-3.5 border border-[#E6DFD3] bg-[#FAF7F2] font-bold uppercase tracking-wider outline-none focus:border-[#7C2517]"
                    />
                  </div>
                  <div>
                    <label class="block font-bold uppercase tracking-wider text-neutral-600 mb-1">11-Digit Mobile Number *</label>
                    <input
                      required
                      type="tel"
                      maxlength="11"
                      value=${trackPhoneInput}
                      onInput=${e => setTrackPhoneInput(cleanBdPhoneInput(e.target.value))}
                      placeholder="01XXXXXXXXX"
                      class="w-full p-3.5 border border-[#E6DFD3] bg-[#FAF7F2] font-bold tracking-wider outline-none focus:border-[#7C2517]"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled=${trackLoading}
                    class="w-full py-3.5 bg-[#7C2517] hover:bg-[#5E1B10] text-white font-bold uppercase tracking-widest transition"
                  >
                    ${trackLoading ? "Checking Parcel Status..." : "Track Parcel Status"}
                  </button>
                </form>

                ${trackErrorMsg && html`
                  <div class="mt-5 p-3.5 bg-red-50 border border-red-200 text-xs text-red-700 font-semibold">
                    ⚠️ ${trackErrorMsg}
                  </div>
                `}

                <!-- Strictly Masked Parcel Status Output (NO address, NO price, NO invoice button!) -->
                ${trackedParcelResult && html`
                  <div class="mt-6 p-5 bg-[#FAF7F2] border-2 border-[#7C2517] space-y-3 text-xs">
                    <div class="flex justify-between items-center border-b border-[#E6DFD3] pb-3">
                      <div>
                        <span class="text-[10px] uppercase font-bold text-neutral-400 block">Order Code</span>
                        <span class="font-extrabold text-base text-[#7C2517]">${trackedParcelResult.orderId}</span>
                      </div>
                      <div class="text-right">
                        <span class="text-[10px] uppercase font-bold text-neutral-400 block">Parcel Status</span>
                        <span class="inline-block mt-0.5 px-3 py-1 bg-[#7C2517] text-white font-bold uppercase tracking-wider text-xs">
                          ${trackedParcelResult.status}
                        </span>
                      </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3 pt-1">
                      <div>
                        <span class="text-[10px] uppercase font-bold text-neutral-400 block">Customer (Masked)</span>
                        <span class="font-bold text-[#1C1614]">${trackedParcelResult.maskedName}</span>
                      </div>
                      <div class="text-right">
                        <span class="text-[10px] uppercase font-bold text-neutral-400 block">Mobile (Masked)</span>
                        <span class="font-bold text-[#1C1614]">${trackedParcelResult.maskedPhone}</span>
                      </div>
                    </div>

                    <div class="pt-2 border-t border-[#E6DFD3] flex justify-between text-neutral-500">
                      <span>Order Date: ${trackedParcelResult.dateFormatted}</span>
                      <span>Parcel Qty: ${trackedParcelResult.itemCount} Pcs</span>
                    </div>

                    <p class="text-[11px] text-neutral-500 pt-1">
                      🔒 সম্পূর্ণ অর্ডার ডিটেইলস এবং ইনভয়েস ডাউনলোড করতে আপনার <button type="button" onClick=${() => setView("profile")} class="underline font-bold text-[#7C2517]">Profile</button>-এ লগইন করুন।
                    </p>
                  </div>
                `}
              </div>
            </div>
          `}

          <!-- ===================================================================== -->
          <!-- SLIDE-OUT SHOPPING CART DRAWER (WITH [ - 1 + ] CONTROLS)              -->
          <!-- ===================================================================== -->
          ${cartOpen && html`
            <div class="fixed inset-0 z-50 bg-black/50 flex justify-end" onClick=${() => setCartOpen(false)}>
              <div class="w-full max-w-sm bg-[#FAF7F2] h-full p-6 flex flex-col justify-between text-[#1C1614]" onClick=${e => e.stopPropagation()}>
                <div>
                  <div class="flex justify-between items-center border-b border-[#E6DFD3] pb-4">
                    <h3 class="font-bold text-sm uppercase tracking-wider text-[#7C2517]">Shopping Cart (${totalItemsCount})</h3>
                    <button onClick=${() => setCartOpen(false)}><${IconClose}/></button>
                  </div>
                  <div class="mt-4 space-y-4 max-h-[65vh] overflow-y-auto pr-1">
                    ${verifiedCart.length === 0 ? html`<p class="text-xs text-neutral-400 py-12 text-center">Your cart is empty.</p>` : verifiedCart.map((item, i) => html`
                      <div key=${item.key} class="flex gap-3 items-center border-b border-[#E6DFD3] pb-3 text-xs">
                        <img src=${item.image} class="w-14 h-18 object-cover bg-white border border-[#E6DFD3] shrink-0" />
                        <div class="flex-1 min-w-0">
                          <p class="font-semibold truncate">${item.nameEn}</p>
                          <p class="text-neutral-500">${item.color} | Size: ${item.size}</p>
                          <div class="flex items-center justify-between mt-1.5">
                            <span class="font-bold text-[#7C2517]">৳ ${item.price * item.qty}</span>
                            <div class="flex items-center border border-[#E6DFD3] bg-white">
                              <button type="button" onClick=${() => updateCartItemQty(item.key, -1)} class="px-2 py-0.5 font-bold">−</button>
                              <span class="px-2 font-bold">${item.qty}</span>
                              <button type="button" onClick=${() => updateCartItemQty(item.key, 1)} class="px-2 py-0.5 font-bold">+</button>
                            </div>
                          </div>
                        </div>
                        <button onClick=${() => setCart(cart.filter((_, idx) => idx !== i))} class="text-neutral-400 hover:text-red-600 px-1">✕</button>
                      </div>
                    `)}
                  </div>
                </div>
                ${verifiedCart.length > 0 && html`
                  <div class="border-t border-[#E6DFD3] pt-4">
                    <div class="flex justify-between font-bold text-sm mb-4">
                      <span>Subtotal</span>
                      <span class="text-[#7C2517]">৳ ${subtotal}</span>
                    </div>
                    <button
                      onClick=${() => {
                        setCartOpen(false);
                        setConfirmedOrder(null);
                        setCleanBrowserUrl("checkout");
                        setView("checkout");
                        window.scrollTo({ top: 0, behavior: "instant" });
                        fireMarketingEvent("InitiateCheckout", {
                          content_ids: verifiedCart.map(c => c.productId),
                          content_name: verifiedCart.map(c => c.nameEn).join(", "),
                          value: subtotal,
                          num_items: totalItemsCount
                        });
                      }}
                      class="w-full py-3.5 bg-[#7C2517] text-white text-xs font-bold uppercase tracking-widest hover:bg-[#5E1B10]"
                    >
                      ORDER
                    </button>
                  </div>
                `}
              </div>
            </div>
          `}

          <!-- INFO POLICY MODAL -->
          ${infoModal && html`
            <div class="fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-4" onClick=${() => setInfoModal(null)}>
              <div class="bg-white border border-[#E6DFD3] p-6 max-w-lg w-full space-y-3 text-xs" onClick=${e => e.stopPropagation()}>
                <div class="flex justify-between items-center border-b border-[#E6DFD3] pb-2.5">
                  <h3 class="font-bold text-sm uppercase text-[#7C2517]">${infoModal.title}</h3>
                  <button onClick=${() => setInfoModal(null)}><${IconClose}/></button>
                </div>
                <p class="leading-relaxed text-neutral-700">${infoModal.body}</p>
              </div>
            </div>
          `}

          <!-- ===================================================================== -->
          <!-- 4-COLUMN MINIMAL FOOTER WITH 5 SOCIAL ICONS                           -->
          <!-- ===================================================================== -->
          <footer class="mt-16 bg-[#14110F] text-neutral-300 text-xs w-full">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 py-12 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
              
              <!-- Column 1: Brand Logo, Short Bio & 5 Social Media Icons -->
              <div class="flex flex-col items-center sm:items-start text-center sm:text-left space-y-3">
                <div class="flex items-center gap-2.5">
                  <${BrandLogoMark} logoUrl=${settings.logoUrl} brandName=${settings.brandName} sizeClass="w-9 h-9" />
                  <span class="font-bold text-base tracking-wider uppercase text-white">${settings.brandName}</span>
                </div>
                <p class="text-neutral-400 leading-relaxed max-w-xs">
                  ${settings.footerBio || "One of the leading contemporary lifestyle & fashion brands in Bangladesh."}
                </p>
                <div class="flex items-center gap-2.5 pt-1">
                  <a href=${settings.facebookUrl} target="_blank" rel="noreferrer" class="w-8 h-8 rounded bg-[#1877F2] text-white flex items-center justify-center hover:opacity-90 transition" title="Facebook">
                    <${IconFacebook}/>
                  </a>
                  <a href=${settings.youtubeUrl} target="_blank" rel="noreferrer" class="w-8 h-8 rounded bg-[#FF0000] text-white flex items-center justify-center hover:opacity-90 transition" title="YouTube">
                    <${IconYoutube}/>
                  </a>
                  <a href=${settings.instagramUrl} target="_blank" rel="noreferrer" class="w-8 h-8 rounded bg-gradient-to-tr from-amber-500 via-pink-600 to-purple-600 text-white flex items-center justify-center hover:opacity-90 transition" title="Instagram">
                    <${IconInstagram}/>
                  </a>
                  <a href=${settings.tiktokUrl || "https://tiktok.com"} target="_blank" rel="noreferrer" class="w-8 h-8 rounded bg-neutral-800 border border-neutral-700 text-white flex items-center justify-center hover:opacity-90 transition" title="TikTok">
                    <${IconTiktok}/>
                  </a>
                  <a href=${settings.linkedinUrl} target="_blank" rel="noreferrer" class="w-8 h-8 rounded bg-[#0A66C2] text-white flex items-center justify-center hover:opacity-90 transition" title="LinkedIn">
                    <${IconLinkedin}/>
                  </a>
                </div>
              </div>

              <!-- Column 2: Account -->
              <div>
                <h4 class="footer-heading">Account</h4>
                <ul class="space-y-2.5 text-neutral-300 font-medium">
                  <li><button onClick=${() => { setIsEditingProfile(false); setView("profile"); window.scrollTo({ top: 0, behavior: "smooth" }); }} class="hover:text-white transition">My Account</button></li>
                  <li><button onClick=${() => { setTrackedParcelResult(null); setTrackErrorMsg(""); setView("track"); window.scrollTo({ top: 0, behavior: "smooth" }); }} class="hover:text-white transition">Track My Order</button></li>
                  <li><button onClick=${() => setCartOpen(true)} class="hover:text-white transition">Shopping Cart</button></li>
                  <li><button onClick=${() => setInfoModal({ title: "Complain Box", body: `For any complaint or size exchange support, please WhatsApp or call us directly at ${settings.whatsapp} with your Order ID.` })} class="hover:text-white transition">Complain Box</button></li>
                </ul>
              </div>

              <!-- Column 3: Information -->
              <div>
                <h4 class="footer-heading">Information</h4>
                <ul class="space-y-2.5 text-neutral-300 font-medium">
                  <li><button onClick=${() => setInfoModal({ title: `About ${settings.brandName}`, body: `${settings.brandName} is a premier lifestyle clothing brand in Bangladesh offering export-quality menswear, womenswear, kids wear, winter jackets, and value combo packs.` })} class="hover:text-white transition">About Us</button></li>
                  <li><button onClick=${() => setInfoModal({ title: "Return & Exchange Policy", body: settings.defaultDeliveryText || "Open Box Delivery Available. Easy 7-Day Size Exchange." })} class="hover:text-white transition">Return & Exchange Policy</button></li>
                  <li><button onClick=${() => setInfoModal({ title: "Privacy Policy", body: "Your contact details and delivery information are strictly kept confidential and used only for order delivery and support." })} class="hover:text-white transition">Privacy Policy</button></li>
                  <li><button onClick=${() => setInfoModal({ title: "Terms & Conditions", body: `All orders include Open Box Delivery inspection. Inside Dhaka delivery charge is ৳${settings.insideDhaka} and Outside Dhaka is ৳${settings.outsideDhaka}.` })} class="hover:text-white transition">Terms & Conditions</button></li>
                </ul>
              </div>

              <!-- Column 4: Talk To Us -->
              <div>
                <h4 class="footer-heading">Talk To Us</h4>
                <p class="text-neutral-400 mb-1">Got Questions? Call us</p>
                <a href="tel:${settings.whatsapp}" class="block text-lg font-extrabold text-white tracking-wide mb-3 hover:text-amber-400 transition">
                  ${settings.whatsapp}
                </a>
                <div class="space-y-2 text-neutral-300">
                  <p class="flex items-center gap-2">
                    <span>✉</span>
                    <span>${settings.adminEmail || "smartoutfitbd@gmail.com"}</span>
                  </p>
                  <p class="flex items-start gap-2 leading-relaxed">
                    <span>📍</span>
                    <span>${settings.addressEn}</span>
                  </p>
                </div>
              </div>
            </div>

            <div class="max-w-7xl mx-auto px-4 sm:px-6">
              <div class="border-t border-white/15 py-5 text-center text-[11px] text-neutral-400">
                © 2026 ${settings.brandName}. All Rights Reserved
              </div>
            </div>
          </footer>

          <!-- DIRECT 1-CLICK WHATSAPP FLOATING BUTTON -->
          <a
            href="https://wa.me/${formatWhatsAppNumber(settings.whatsapp)}?text=${encodeURIComponent("Hello SMART OUTFIT! I would like to know more about your products.")}"
            target="_blank"
            rel="noopener noreferrer"
            class="fixed bottom-5 right-5 z-40 w-12 h-12 rounded-full bg-[#25D366] hover:bg-[#1ebe57] text-white shadow-lg flex items-center justify-center hover:scale-105 transition"
            title="Message us on WhatsApp"
          >
            <${IconWhatsApp}/>
          </a>
        </div>
      `;
    }

    render(html`<${SmartOutfitApp} />`, document.getElementById("root"));
  </script>
</body>
</html>
