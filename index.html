    // 3. CLIENT-SIDE WEBP IMAGE COMPRESSOR (AUTO-OPTIMIZES MOBILE LOAD SPEED)
    // ============================================================================
    const compressImageToWebP = (file, maxWidth = 1000, quality = 0.82) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ratio = img.width > maxWidth ? maxWidth / img.width : 1;
            canvas.width = img.width * ratio;
            canvas.height = img.height * ratio;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            const webpDataUrl = canvas.toDataURL("image/webp", quality);
            resolve(webpDataUrl);
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

      // 5. META PIXEL, GOOGLE TAG & CUSTOM BEHAVIOUR TRACKING ENGINE
      // ============================================================================
      const trackEvent = (eventName, payload = {}) => {
        console.log(`[PIXEL/TAG]: ${eventName}`, payload);
        if (window.fbq) window.fbq("track", eventName, payload);
        if (window.gtag) window.gtag("event", eventName, payload);
      };

      useEffect(() => {
        trackEvent("PageView", { page: view });
        const timer30 = setTimeout(() => trackEvent("TimeSpent_30s", { page: view }), 30000);
        const timer60 = setTimeout(() => trackEvent("TimeSpent_60s", { page: view }), 60000);
        return () => { clearTimeout(timer30); clearTimeout(timer60); };
      }, [view]);

      // Capture Incomplete / Abandoned Order as soon as 11-digit phone is entered
      useEffect(() => {
        const cleanPhone = customerForm.phone.replace(/\D/g, "");
        if (cleanPhone.length >= 11 && cart.length > 0) {
          const draft = {
            id: "ABD-" + cleanPhone,
            name: customerForm.name || "Guest",
            phone: customerForm.phone,
            address: customerForm.address || "",
            items: cart.map(c => `${c.nameEn} (${c.color}/${c.size}) x${c.qty}`).join(", "),
            total: cart.reduce((s, i) => s + i.price * i.qty, 0),
            time: new Date().toLocaleString("en-GB")
          };
          setAbandonedCarts(prev => {
            const updated = [draft, ...prev.filter(x => x.phone !== customerForm.phone)];
            syncData("so_v2_abandoned", updated, "abandoned");
            return updated;
          });
        }
      }, [customerForm.phone, customerForm.name, customerForm.address]);

      // ============================================================================
      // 6. PRODUCT & MULTI-VARIANT CART FUNCTIONS
      // ============================================================================
      const openProductPage = (prod) => {
        setSelectedProduct(prod);
        setSelectedColorIdx(0);
        const firstSizes = Object.keys(prod.colors[0]?.stock || {});
        setSelectedSize(firstSizes[0] || "32");
        setMultiPackMode(false);
        setMultiPackRows([
          { colorIdx: 0, size: firstSizes[0] || "32" },
          { colorIdx: prod.colors.length > 1 ? 1 : 0, size: firstSizes[1] || firstSizes[0] || "34" }
        ]);
        setView("product");
        window.scrollTo({ top: 0, behavior: "smooth" });
        trackEvent("ViewContent", {
          content_ids: [prod.id],
          content_name: prod.nameEn,
          value: prod.discountPrice,
          currency: "BDT"
        });
      };

      const handleAddToCart = (directBuy = false) => {
        if (!selectedProduct) return;
        let updatedCart = [...cart];

        if (multiPackMode) {
          multiPackRows.forEach((row) => {
            const colorObj = selectedProduct.colors[row.colorIdx] || selectedProduct.colors[0];
            const key = `${selectedProduct.id}-${colorObj.name}-${row.size}`;
            const idx = updatedCart.findIndex(item => item.key === key);
            if (idx > -1) {
              updatedCart[idx].qty += 1;
            } else {
              updatedCart.push({
                key,
                productId: selectedProduct.id,
                sku: `${selectedProduct.sku}-${colorObj.name.slice(0,3).toUpperCase()}-${row.size}`,
                nameEn: selectedProduct.nameEn,
                nameBn: selectedProduct.nameBn,
                color: colorObj.name,
                size: row.size,
                price: Number(selectedProduct.discountPrice),
                freeDelivery: Boolean(selectedProduct.freeDelivery),
                image: colorObj.image,
                qty: 1
              });
            }
          });
        } else {
          const colorObj = selectedProduct.colors[selectedColorIdx] || selectedProduct.colors[0];
          const key = `${selectedProduct.id}-${colorObj.name}-${selectedSize}`;
          const idx = updatedCart.findIndex(item => item.key === key);
          if (idx > -1) {
            updatedCart[idx].qty += 1;
          } else {
            updatedCart.push({
              key,
              productId: selectedProduct.id,
              sku: `${selectedProduct.sku}-${colorObj.name.slice(0,3).toUpperCase()}-${selectedSize}`,
              nameEn: selectedProduct.nameEn,
              nameBn: selectedProduct.nameBn,
              color: colorObj.name,
              size: selectedSize,
              price: Number(selectedProduct.discountPrice),
              freeDelivery: Boolean(selectedProduct.freeDelivery),
              image: colorObj.image,
              qty: 1
            });
          }
        }

        setCart(updatedCart);
        trackEvent("AddToCart", {
          content_name: selectedProduct.nameEn,
          value: selectedProduct.discountPrice,
          currency: "BDT"
        });

        if (directBuy) {
          setCartOpen(false);
          setConfirmedOrder(null);
          setView("checkout");
          window.scrollTo({ top: 0, behavior: "smooth" });
          trackEvent("InitiateCheckout");
        } else {
          notify(t("Added to Bag", "ব্যাগে যুক্ত হয়েছে"));
          setCartOpen(true);
        }
      };

      const addComboToCart = (combo) => {
        const key = `${combo.id}-COMBO`;
        const updatedCart = [
          ...cart,
          {
            key,
            productId: combo.id,
            sku: combo.id,
            nameEn: combo.titleEn,
            nameBn: combo.titleBn,
            color: "Combo Pack",
            size: "Standard",
            price: Number(combo.comboPrice),
            freeDelivery: Boolean(combo.freeDelivery),
            image: combo.image,
            qty: 1
          }
        ];
        setCart(updatedCart);
        setConfirmedOrder(null);
        setView("checkout");
      };

      // ============================================================================
      // 7. 4-TIER SMART DELIVERY FEE AUTO-CALCULATION
      // ============================================================================
      const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const totalItemsCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const multiBuyDiscount = totalItemsCount >= 3 ? 150 : 0; // Bonus ৳150 off on 3+ items
      const hasProductFreeDelivery = cart.some(i => i.freeDelivery);
      const qualifiesMinSpend = settings.enableMinSpendRule && subtotal >= Number(settings.minSpendFreeDelivery);
      const isFreeDelivery = settings.globalFreeDelivery || hasProductFreeDelivery || qualifiesMinSpend || cart.length === 0;

      const deliveryCharge = isFreeDelivery
        ? 0
        : customerForm.zone === "inside"
        ? Number(settings.insideDhaka)
        : Number(settings.outsideDhaka);

      const grandTotal = Math.max(0, subtotal - multiBuyDiscount + deliveryCharge);

      // ============================================================================
      // 8. PLACE ORDER, STOCK DEDUCTION & AUTO EMAIL WEBHOOK
      // ============================================================================
      const submitOrder = async (e) => {
        e.preventDefault();
        if (!customerForm.name || !customerForm.phone || !customerForm.address || cart.length === 0) return;

        const now = new Date();
        const yearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
        const randomCode = Math.floor(1000 + Math.random() * 9000);
        const orderId = `SO-${randomCode}`;

        const newOrder = {
          orderId,
          createdAt: now.toISOString(),
          dateFormatted: now.toLocaleDateString("en-GB") + " " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          yearMonth,
          customer: { ...customerForm },
          items: [...cart],
          subtotal,
          discount: multiBuyDiscount,
          deliveryCharge,
          grandTotal,
          status: "Pending", // Pending | Confirmed | Shipped | Delivered | Returned | Cancelled
          source: "Website",
          courierCode: ""
        };

        // 1. Save to Local & Firestore
        const updatedOrders = [newOrder, ...orders];
        setOrders(updatedOrders);
        localStorage.setItem("so_v2_orders", JSON.stringify(updatedOrders));
        if (db) {
          db.collection("orders").doc(orderId).set(newOrder).catch(() => {});
        }

        // 2. Deduct Inventory Stock automatically
        const updatedProducts = products.map(p => {
          const prodCopy = { ...p, colors: p.colors.map(c => ({ ...c, stock: { ...c.stock } })) };
          cart.forEach(cItem => {
            if (cItem.productId === prodCopy.id) {
              const colIdx = prodCopy.colors.findIndex(col => col.name === cItem.color);
              if (colIdx > -1 && prodCopy.colors[colIdx].stock[cItem.size] !== undefined) {
                prodCopy.colors[colIdx].stock[cItem.size] = Math.max(0, Number(prodCopy.colors[colIdx].stock[cItem.size]) - cItem.qty);
              }
            }
          });
          return prodCopy;
        });
        setProducts(updatedProducts);
        syncData("so_v2_products", updatedProducts, "products");

        // 3. Remove from Abandoned Carts
        const cleanAbd = abandonedCarts.filter(a => a.phone !== customerForm.phone);
        setAbandonedCarts(cleanAbd);
        syncData("so_v2_abandoned", cleanAbd, "abandoned");

        // 4. Fire Meta Purchase Event
        trackEvent("Purchase", {
          value: grandTotal,
          currency: "BDT",
          order_id: orderId
        });

        // 5. Trigger Auto Confirmation Email Webhook (if configured)
        if (settings.emailWebhookUrl && customerForm.email) {
          fetch(settings.emailWebhookUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(newOrder)
          }).catch(() => {});
        }

        setConfirmedOrder(newOrder);
        setCart([]);
        notify(t("Order Confirmed!", "অর্ডার সম্পন্ন হয়েছে!"));
      };

      // Update Order Status + Auto Return Stock Sync
      const handleOrderStatusChange = (orderId, newStatus) => {
        const targetOrder = orders.find(o => o.orderId === orderId);
        if (!targetOrder) return;

        // If marked Returned, add stock back (+1)
        if (newStatus === "Returned" && targetOrder.status !== "Returned") {
          const restoredProducts = products.map(p => {
            const copy = { ...p };
            targetOrder.items.forEach(item => {
              if (item.productId === copy.id) {
                const cIdx = copy.colors.findIndex(c => c.name === item.color);
                if (cIdx > -1 && copy.colors[cIdx].stock[item.size] !== undefined) {
                  copy.colors[cIdx].stock[item.size] = Number(copy.colors[cIdx].stock[item.size]) + item.qty;
                }
              }
            });
            return copy;
          });
          setProducts(restoredProducts);
          syncData("so_v2_products", restoredProducts, "products");
          notify("Stock Auto-Restored (+1)");
        }

        const updated = orders.map(o => o.orderId === orderId ? { ...o, status: newStatus } : o);
        setOrders(updated);
        localStorage.setItem("so_v2_orders", JSON.stringify(updated));
        if (db) db.collection("orders").doc(orderId).update({ status: newStatus }).catch(() => {});
      };

      // Export Orders to Excel/CSV (For Steadfast / Google Sheets)
      const downloadOrdersCSV = (listToExport) => {
        const headers = ["OrderID", "Date", "CustomerName", "Phone", "Address", "Items", "COD_Amount", "Status", "Source"];
        const rows = listToExport.map(o => [
          o.orderId,
          o.dateFormatted,
          `"${o.customer.name}"`,
          o.customer.phone,
          `"${o.customer.address.replace(/"/g, '""')}"`,
          `"${o.items.map(i => `${i.sku || i.nameEn} (${i.color}-${i.size}) x${i.qty}`).join(" | ")}"`,
          o.grandTotal,
          o.status,
          o.source || "Website"
        ]);
        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `SMART_OUTFIT_ORDERS_${monthFilter}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Filter Products for Storefront
      const visibleProducts = useMemo(() => {
        return products.filter(p => {
          if (searchQuery.trim() !== "") {
            const q = searchQuery.toLowerCase();
            return p.nameEn.toLowerCase().includes(q) || p.nameBn.includes(q) || p.sku.toLowerCase().includes(q);
          }
          if (activeTab === "Home") return true;
          if (activeTab === "Winter") return Boolean(p.isWinter);
          if (p.category !== activeTab) return false;
          if (activeSubCat !== "All" && p.subCategory !== activeSubCat) return false;
          return true;
        });
      }, [products, activeTab, activeSubCat, searchQuery]);

      // Monthly Filtered Orders for Admin Analytics
      const availableMonths = useMemo(() => {
        const set = new Set(orders.map(o => o.yearMonth).filter(Boolean));
        return ["ALL", ...Array.from(set)];
      }, [orders]);

      const filteredAdminOrders = useMemo(() => {
        if (monthFilter === "ALL") return orders;
        return orders.filter(o => o.yearMonth === monthFilter);
      }, [orders, monthFilter]);

      const monthlyStats = useMemo(() => {
        const totalCount = filteredAdminOrders.length;
        const deliveredOrders = filteredAdminOrders.filter(o => o.status === "Delivered");
        const deliveredRevenue = deliveredOrders.reduce((s, o) => s + Number(o.grandTotal), 0);
        const pendingOrders = filteredAdminOrders.filter(o => ["Pending", "Confirmed", "Shipped"].includes(o.status));
        const pendingAmount = pendingOrders.reduce((s, o) => s + Number(o.grandTotal), 0);
        const returnedCount = filteredAdminOrders.filter(o => ["Returned", "Cancelled"].includes(o.status)).length;
        return { totalCount, deliveredCount: deliveredOrders.length, deliveredRevenue, pendingCount: pendingOrders.length, pendingAmount, returnedCount };
      }, [filteredAdminOrders]);

      // Recommended Size Calculator
      const recommendedSize = useMemo(() => {
        if (fitWeight < 55) return "28 / M";
        if (fitWeight <= 64) return "30 / M";
        if (fitWeight <= 73) return "32 / L";
        if (fitWeight <= 82) return "34 / XL";
        return "36 / XXL";
      }, [fitHeight, fitWeight]);

      const currentBanner = settings.banners?.[bannerIdx] || DEFAULT_SETTINGS.banners[0];

      return (
        <div className={`${darkMode ? "bg-[#0D0D0D] text-[#F3EFE6]" : "bg-[#F3EFE6] text-[#0D0D0D]"} min-h-screen pb-20 md:pb-0 transition-colors duration-200`}>
          
          {/* QUICK TOAST ALERT */}
          {toast && (
            <div className="fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-[#822B17] text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg">
              ✓ {toast}
            </div>
          )}

          {/* TOP RUNNING ANNOUNCEMENT BAR */}
          <div className="bg-[#822B17] text-white text-[11px] sm:text-xs font-semibold py-2 px-4 text-center tracking-wide">
            {t(settings.announcementEn, settings.announcementBn)}
          </div>

          {/* STICKY ULTRA-MINIMAL HEADER */}
          <header className={`sticky top-0 z-40 border-b backdrop-blur-md ${darkMode ? "bg-[#0D0D0D]/95 border-neutral-800" : "bg-[#F3EFE6]/95 border-[#E2DDD2]"}`}>
            <div className="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-2">
              
              {/* Brand Logo (Minimal S + Hanger Icon) */}
              <div
                onClick={() => { setView("store"); setActiveTab("Home"); setActiveSubCat("All"); }}
                className="flex items-center gap-2.5 cursor-pointer select-none"
              >
                <div className="w-10 h-10 rounded-full bg-[#822B17] text-[#F3EFE6] flex flex-col items-center justify-center shadow-sm border border-white/15">
                  <span className="font-extrabold text-base leading-none tracking-tighter">S</span>
                  <span className="w-4 h-0.5 bg-[#F3EFE6] rounded-full mt-0.5"></span>
                </div>
                <div>
                  <h1 className="font-extrabold text-base sm:text-lg leading-none tracking-tight">{settings.brandName}</h1>
                  <p className="text-[10px] opacity-70 uppercase tracking-widest mt-0.5">{settings.tagline}</p>
                </div>
              </div>

              {/* Desktop Navigation Tabs */}
              <nav className="hidden lg:flex items-center gap-6 text-sm font-semibold">
                {[
                  { id: "Home", en: "Home", bn: "হোম" },
                  { id: "Pants", en: "Pants", bn: "প্যান্ট" },
                  { id: "Jackets", en: "Jackets", bn: "জ্যাকেট" },
                  { id: "Shirts", en: "Shirts", bn: "শার্ট" },
                  { id: "Winter", en: "Winter", bn: "উইন্টার" },
                  { id: "Combos", en: "Combos", bn: "কম্বো" },
                  { id: "Blog", en: "Blog", bn: "ব্লগ" }
                ].map(tab => (
                  <button
                    key={tab.id}
                    onClick={() => { setView("store"); setActiveTab(tab.id); setActiveSubCat("All"); }}
                    className={`py-1 border-b-2 transition ${activeTab === tab.id && view === "store" ? "border-[#822B17] text-[#822B17] font-bold" : "border-transparent opacity-75 hover:opacity-100"}`}
                  >
                    {t(tab.en, tab.bn)}
                  </button>
                ))}
                <button
                  onClick={() => setView("trial")}
                  className="text-xs font-bold px-3 py-1.5 rounded-full bg-[#822B17]/10 text-[#822B17]"
                >
                  {t("Trial Studio", "ট্রায়াল রুম")}
                </button>
                <button
                  onClick={() => setView("track")}

                  {t("Track Order", "অর্ডার ট্র্যাক")}

              </nav>

              {/* Right Utilities: Search, EN/BN, DarkMode, Profile, Admin, Bag */}
              <div className="flex items-center gap-1.5 sm:gap-2.5">
                <button
                  onClick={() => setSearchOpen(!searchOpen)}

                  🔍
                </button>

                <button

                  {lang === "en" ? "বাং" : "EN"}

                {/* 1-Click Night Mode Toggle */}
                <button

                  {darkMode ? "☀️" : "🌙"}

                {/* Customer Profile */}
                <button
                  onClick={() => setView("profile")}

                  👤
                </button>

                {/* Zero-Code Super Admin Button */}
                <button

                  ⚙️

                {/* Shopping Bag Drawer Button */}
                <button
                  onClick={() => setCartOpen(true)}

                >
                  <span>🛍️</span>
                  <span>{totalItemsCount}</span>
                </button>
              </div>
            </div>

            {/* Instant Search Bar */}
            {searchOpen && (
              <div className="max-w-3xl mx-auto px-4 py-2.5 border-t border-current/10">
                <input
                  autoFocus
                  value={searchQuery}
                  onChange={e => { setSearchQuery(e.target.value); setView("store"); }}
                  placeholder={t("Search Cargo, Denim, Jacket or SKU...", "কার্গো প্যান্ট, ডেনিম বা জ্যাকেট খুঁজুন...")}
                  className="w-full p-2.5 rounded-lg border border-current/20 bg-transparent text-sm outline-none"
                />
              </div>
            )}

            {/* Mobile Horizontal Category Bar */}
            <div className="flex lg:hidden overflow-x-auto no-scrollbar gap-2 px-4 py-2 border-t border-current/10 text-xs font-bold">
              {[
                { id: "Home", en: "Home", bn: "হোম" },
                { id: "Pants", en: "Pants", bn: "প্যান্ট" },
                { id: "Jackets", en: "Jackets", bn: "জ্যাকেট" },
                { id: "Shirts", en: "Shirts", bn: "শার্ট" },
                { id: "Winter", en: "Winter", bn: "উইন্টার" },
                { id: "Combos", en: "Combos", bn: "কম্বো" },
                { id: "Blog", en: "Blog", bn: "ব্লগ" }
              ].map(tab => (
                <button
                  key={tab.id}
                  onClick={() => { setView("store"); setActiveTab(tab.id); setActiveSubCat("All"); }}
                  className={`px-3.5 py-1.5 rounded-full whitespace-nowrap transition ${activeTab === tab.id && view === "store" ? "bg-[#822B17] text-white" : "bg-current/5"}`}
                >
                  {t(tab.en, tab.bn)}
                </button>
              ))}
            </div>
          </header>

          {/* ===================================================================== */}
          {/* VIEW 1: STOREFRONT (HOME, CATEGORIES, COMBOS & BLOGS)                 */}
          {/* ===================================================================== */}
          {view === "store" && (
            <main className="max-w-7xl mx-auto px-4 py-6">
              
              {/* Multi-Banner Slider (Shown on Home) */}
              {activeTab === "Home" && !searchQuery && (
                <div className="relative rounded-2xl overflow-hidden mb-8 bg-[#181514] text-white min-h-[250px] sm:min-h-[380px] flex items-center">
                  <img
                    src={currentBanner.image}
                    alt={currentBanner.titleEn}
                    className="absolute inset-0 w-full h-full object-cover opacity-50 transition-all duration-700"
                  />
                  <div className="relative z-10 p-6 sm:p-12 max-w-xl">
                    <span className="inline-block bg-[#822B17] text-white text-[10px] sm:text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-3">
                      {t(currentBanner.badgeEn, currentBanner.badgeBn)}
                    </span>
                    <h2 className="text-2xl sm:text-4xl font-extrabold leading-tight">
                      {t(currentBanner.titleEn, currentBanner.titleBn)}
                    </h2>
                    <p className="text-xs sm:text-sm opacity-85 mt-2">
                      {t(currentBanner.subEn, currentBanner.subBn)}
                    </p>
                    <div className="flex flex-wrap gap-3 mt-5">
                      <button
                        onClick={() => setActiveTab(currentBanner.ctaTab || "Pants")}

                      >
                        {t("Explore Collection", "কালেকশন দেখুন")}
                      </button>
                      <button
                        onClick={() => setView("trial")}
                        className="bg-white/15 backdrop-blur-md hover:bg-white/25 text-white font-bold text-xs sm:text-sm px-5 py-3 rounded-lg transition"
                      >
                        {t("Mix & Match Studio", "ট্রায়াল রুম")}
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* Flash Sale Strip (Admin Toggleable) */}
              {activeTab === "Home" && settings.flashSaleActive && (
                <div className="mb-8 p-4 rounded-xl bg-[#822B17] text-white flex flex-wrap items-center justify-between gap-3">
                  <div className="flex items-center gap-2.5">
                    <span className="text-lg">⚡</span>
                    <div>
                      <h3 className="font-extrabold text-sm sm:text-base">{t(settings.flashSaleTitleEn, settings.flashSaleTitleBn)}</h3>
                      <p className="text-[11px] opacity-85">{t("Buy 3 Pants & Get Extra ৳150 Instant Discount", "একসাথে ৩টি প্যান্ট নিলেই অতিরিক্ত ৳১৫০ ছাড়")}</p>
                    </div>
                  </div>

                          value={settings.insideDhaka}
                          onChange={e => {
                            const updated = { ...settings, insideDhaka: Number(e.target.value) };
                            setSettings(updated);
                            syncData("so_v2_settings", updated, "settings");
                          }}
                          className="w-full p-2 rounded border border-current/20 bg-transparent mt-1"
                        />
                      </div>
                      <div>
                        <span>Outside Dhaka (৳)</span>
                        <input
                          type="number"
                          value={settings.outsideDhaka}
                          onChange={e => {
                            const updated = { ...settings, outsideDhaka: Number(e.target.value) };
                            setSettings(updated);
                            syncData("so_v2_settings", updated, "settings");
                          }}
                          className="w-full p-2 rounded border border-current/20 bg-transparent mt-1"
                        />
                      </div>
                    </div>
                    <div>
                      <span>Minimum Spend for Auto Free Delivery (৳)</span>
                      <input
                        type="number"
                        value={settings.minSpendFreeDelivery}
                        onChange={e => {
                          const updated = { ...settings, minSpendFreeDelivery: Number(e.target.value) };
                          setSettings(updated);
                          syncData("so_v2_settings", updated, "settings");
                        }}
                        className="w-full p-2 rounded border border-current/20 bg-transparent mt-1"
                      />
                    </div>
                  </div>

                  <div className="p-5 rounded-xl border border-current/15 space-y-3">
                    <h3 className="font-extrabold text-sm text-[#822B17] uppercase">WhatsApp, Meta Pixel & Email Webhook</h3>
                    <div>
                      <span>Floating WhatsApp Number (with 880)</span>
                      <input
                        value={settings.whatsapp}
                        onChange={e => {
                          const updated = { ...settings, whatsapp: e.target.value };
                          setSettings(updated);
                          syncData("so_v2_settings", updated, "settings");
                        }}
                        className="w-full p-2 rounded border border-current/20 bg-transparent mt-1"
                      />
                    </div>
                    <div>
                      <span>Meta Pixel ID</span>
                      <input
                        value={settings.metaPixelId}
                        onChange={e => {
                          const updated = { ...settings, metaPixelId: e.target.value };
                          setSettings(updated);
                          syncData("so_v2_settings", updated, "settings");
                        }}
                        placeholder="e.g. 123456789012345"
                        className="w-full p-2 rounded border border-current/20 bg-transparent mt-1"
                      />
                    </div>
                    <div>
                      <span>Auto Confirmation Email Webhook URL (Google Script)</span>
                      <input
                        value={settings.emailWebhookUrl}
                        onChange={e => {
                          const updated = { ...settings, emailWebhookUrl: e.target.value };
                          setSettings(updated);
                          syncData("so_v2_settings", updated, "settings");
                        }}
                        placeholder="https://script.google.com/macros/s/..."
                        className="w-full p-2 rounded border border-current/20 bg-transparent mt-1"
                      />
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ===================================================================== */}
          {/* SLIDE-OUT SHOPPING BAG DRAWER                                         */}
          {/* ===================================================================== */}
          {cartOpen && (
            <div className="fixed inset-0 z-50 bg-black/60 flex justify-end">
              <div className={`w-full max-w-md h-full p-5 flex flex-col justify-between ${darkMode ? "bg-[#121212] text-white" : "bg-[#F3EFE6] text-[#0D0D0D]"}`}>
                <div>
                  <div className="flex justify-between items-center border-b border-current/10 pb-3">
                    <h3 className="font-extrabold text-base">{t("Shopping Bag", "আপনার ব্যাগ")} ({totalItemsCount})</h3>
                    <button onClick={() => setCartOpen(false)} className="text-lg font-bold">✕</button>
                  </div>

                  {/* Free Delivery Progress Bar */}
                  {settings.enableMinSpendRule && subtotal < settings.minSpendFreeDelivery && (
                    <div className="my-3 p-2.5 rounded-lg bg-[#822B17]/10 text-[#822B17] text-xs font-bold text-center">
                      {t(
                        `Add ৳${settings.minSpendFreeDelivery - subtotal} more for FREE Delivery!`,
                        `আর ৳${settings.minSpendFreeDelivery - subtotal} কেনাকাটা করলেই ফ্রি ডেলিভারি!`
                      )}
                    </div>
                  )}

                  <div className="mt-3 space-y-3 max-h-[60vh] overflow-y-auto">
                    {cart.length === 0 ? (
                      <p className="text-xs opacity-60 py-12 text-center">{t("Your bag is empty.", "আপনার ব্যাগ খালি।")}</p>
                    ) : (
                      cart.map((item, i) => (
                        <div key={item.key} className="flex gap-3 items-center border-b border-current/10 pb-3 text-xs">
                          <img src={item.image} className="w-14 h-16 object-cover rounded-lg" />
                          <div className="flex-1">
                            <p className="font-bold text-sm">{t(item.nameEn, item.nameBn)}</p>
                            <p className="opacity-70">{item.color} • Size: {item.size}</p>
                            <p className="font-extrabold text-[#822B17] mt-0.5">৳{item.price} × {item.qty}</p>
                          </div>
                          <button
                            onClick={() => setCart(cart.filter((_, idx) => idx !== i))}
                            className="text-red-500 font-bold px-2"
                          >
                            ✕
                          </button>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                {cart.length > 0 && (
                  <div className="border-t border-current/15 pt-4">
                    <div className="flex justify-between font-extrabold text-base mb-3">
                      <span>{t("Subtotal", "মোট")}</span>
                      <span>৳{subtotal}</span>
                    </div>
                    <button
                      onClick={() => { setCartOpen(false); setConfirmedOrder(null); setView("checkout"); }}
                      className="w-full py-3.5 rounded-xl bg-[#822B17] text-white font-bold text-sm shadow-md"
                    >
                      {t("Proceed to Checkout", "চেকআউট করুন")}
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* ===================================================================== */}
          {/* BIG-BRAND MINIMAL FOOTER                                              */}
          {/* ===================================================================== */}
          <footer className={`mt-16 border-t py-10 px-4 text-xs ${darkMode ? "bg-[#090909] border-neutral-800" : "bg-[#EAE5D9] border-[#DDD7C8]"}`}>
            <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8">
              <div>
                <h3 className="font-extrabold text-base text-[#822B17]">{settings.brandName}</h3>
                <p className="opacity-75 mt-1">{settings.tagline}</p>
                <p className="opacity-70 mt-2">{t(settings.factoryAddressEn, settings.factoryAddressBn)}</p>
              </div>
              <div className="space-y-1.5 font-semibold">
                <p className="font-extrabold uppercase opacity-60">{t("Quick Links", "প্রয়োজনীয় লিংক")}</p>
                <button onClick={() => setView("track")} className="block hover:underline">{t("Track Order", "অর্ডার ট্র্যাক")}</button>
                <button onClick={() => setView("trial")} className="block hover:underline">{t("Mix & Match Studio", "ট্রায়াল রুম")}</button>
                <button onClick={() => setView("profile")} className="block hover:underline">{t("Customer Profile", "কাস্টমার প্রোফাইল")}</button>
              </div>
              <div className="space-y-1.5">
                <p className="font-extrabold uppercase opacity-60">{t("Guarantee", "গ্যারান্টি")}</p>
                <p>✓ 7-Day Easy Size Exchange</p>
                <p>✓ Open-Box Cash on Delivery</p>
                <p>✓ Direct Garments Factory QC</p>
              </div>
            </div>
          </footer>

          {/* ===================================================================== */}
          {/* CIRCULAR FLOATING WHATSAPP CHAT BUTTON                                */}
          {/* ===================================================================== */}
          <a
            href={`https://wa.me/${settings.whatsapp}?text=${encodeURIComponent(
              selectedProduct
                ? `Hi SMART OUTFIT, Product: ${selectedProduct.nameEn} (৳${selectedProduct.discountPrice})`
                : "Hi SMART OUTFIT!"
            )}`}
            target="_blank"
            rel="noreferrer"
            className="no-print fixed bottom-20 md:bottom-6 right-4 z-40 w-13 h-13 w-12 h-12 rounded-full bg-[#168A45] text-white shadow-xl flex items-center justify-center hover:scale-105 transition"
            title="WhatsApp Support"
          >
            <svg className="w-6 h-6 fill-current" viewBox="0 0 24 24">
              <path d="M12.031 6.172c-3.181 0-5.767 2.586-5.768 5.766-.001 1.298.38 2.27 1.019 3.287l-.582 2.128 2.182-.573c.978.58 1.911.928 3.145.929 3.178 0 5.767-2.587 5.768-5.766.001-3.187-2.575-5.77-5.764-5.771zm3.392 8.244c-.144.405-.837.774-1.17.824-.299.045-.677.063-1.092-.069-.252-.08-.575-.187-.988-.365-1.739-.751-2.874-2.502-2.961-2.617-.087-.116-.708-.94-.708-1.793s.448-1.273.607-1.446c.159-.173.346-.217.462-.217l.332.006c.106.005.249-.04.39.298.144.347.491 1.2.534 1.287.043.087.072.188.014.304-.058.116-.087.188-.173.289l-.26.304c-.087.086-.177.18-.076.354.101.174.449.741.964 1.201.662.591 1.221.774 1.394.86s.274.072.376-.043c.101-.116.433-.506.549-.68.116-.173.231-.145.39-.087s1.011.477 1.184.564.289.13.332.202c.045.072.045.419-.1.824z"/>
            </svg>
          </a>

          {/* ===================================================================== */}
          {/* MOBILE FIXED BOTTOM APP BAR                                           */}
          {/* ===================================================================== */}
          <div className={`no-print md:hidden fixed bottom-0 inset-x-0 z-40 h-15 py-2 border-t grid grid-cols-5 text-[11px] font-bold ${darkMode ? "bg-[#0D0D0D] border-neutral-800" : "bg-[#F3EFE6] border-[#E2DDD2]"}`}>
            <button onClick={() => { setView("store"); setActiveTab("Home"); }} className="flex flex-col items-center justify-center">
              <span>🏠</span>
              <span>{t("Home", "হোম")}</span>
            </button>
            <button onClick={() => { setView("store"); setActiveTab("Pants"); }} className="flex flex-col items-center justify-center">
              <span>👖</span>
              <span>{t("Pants", "প্যান্ট")}</span>
            </button>
            <button onClick={() => setView("trial")} className="flex flex-col items-center justify-center">
              <span>✨</span>
              <span>{t("Trial", "ট্রায়াল")}</span>
            </button>
            <button onClick={() => setView("track")} className="flex flex-col items-center justify-center">
              <span>🚚</span>
              <span>{t("Track", "ট্র্যাক")}</span>
            </button>
            <button onClick={() => setCartOpen(true)} className="flex flex-col items-center justify-center text-[#822B17]">
              <span>🛍️ ({totalItemsCount})</span>
              <span>{t("Bag", "ব্যাগ")}</span>
            </button>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<SmartOutfitApp />);
  </script>
</body>
</html>
