      top: 0;

    // ============================================================================
    // 3. STRICT DELIVERY FEE CALCULATOR (Fixes <1000 Taka Free Delivery Bug)
    // ============================================================================
    function calculateDeliveryFee(cartItems, zone, settings) {
      if (!cartItems || cartItems.length === 0) return 0;

      const subtotal = cartItems.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);
      const isGlobalFree = settings.globalFreeDelivery === true || settings.globalFreeDelivery === "true" && false; // strictly boolean true
      if (settings.globalFreeDelivery === true) {
        return 0;
      }

      const minSpendEnabled = settings.enableMinSpendRule === true;
      const minSpendAmount = Number(settings.minSpendFreeDelivery) || 0;
      if (minSpendEnabled && minSpendAmount > 0 && subtotal >= minSpendAmount) {
        return 0;
      }

      const allItemsExplicitlyFree = cartItems.every(item => item.freeDelivery === true);
      if (allItemsExplicitlyFree) {
        return 0;
      }

      const insideFee = Number(settings.insideDhaka);
      const outsideFee = Number(settings.outsideDhaka);
      const validInside = !isNaN(insideFee) && insideFee >= 0 ? insideFee : 70;
      const validOutside = !isNaN(outsideFee) && outsideFee >= 0 ? outsideFee : 130;

      return zone === 'outside' ? validOutside : validInside;
    }

    // ============================================================================
    // 4. PRIVACY MASKING HELPERS FOR PARCEL TRACKING
    // ============================================================================
    function maskPhoneNumber(phone) {
      const clean = String(phone || '').replace(/\D/g, '');
      if (clean.length < 7) return '01*****';
      return clean.slice(0, 3) + '****' + clean.slice(-4);
    }

    function maskCustomerName(name) {
      const str = String(name || 'Customer').trim();
      if (str.length <= 3) return str[0] + '**';
      const parts = str.split(' ');
      return parts.map(p => p.length > 2 ? p.slice(0, 2) + '***' : p).join(' ');
    }

    // ============================================================================
    // 5. META PIXEL + CAPI DEDUPLICATED TRACKING ENGINE + GA4
    // ============================================================================
    let initializedPixelId = null;
    let initializedGa4Id = null;

    function initTrackingScripts(settings) {
      const pixelId = (settings.metaPixelId || '').trim();
      const ga4Id = (settings.ga4Id || '').trim();

      if (pixelId && initializedPixelId !== pixelId) {
        initializedPixelId = pixelId;
        if (!window.fbq) {
          !(function(f,b,e,v,n,t,s){
            if(f.fbq)return;n=f.fbq=function(){n.callMethod?
            n.callMethod.apply(n,arguments):n.queue.push(arguments)};
            if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
            n.queue=[];t=b.createElement(e);t.async=!0;
            t.src=v;s=b.getElementsByTagName(e)[0];
            s.parentNode.insertBefore(t,s)
          })(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
        }
        window.fbq('init', pixelId);
        const pageEventId = 'pv_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
        window.fbq('track', 'PageView', {}, { eventID: pageEventId });
        sendCapiEvent('PageView', {}, {}, pageEventId, settings);
      }

      if (ga4Id && initializedGa4Id !== ga4Id) {
        initializedGa4Id = ga4Id;
        const script = document.createElement('script');
        script.async = true;
        script.src = `https://www.googletagmanager.com/gtag/js?id=${ga4Id}`;
        document.head.appendChild(script);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){ window.dataLayer.push(arguments); };
        window.gtag('js', new Date());
        window.gtag('config', ga4Id);
      }
    }

    async function sha256Hash(str) {
      if (!str) return undefined;
      const clean = String(str).trim().toLowerCase();
      if (!clean) return undefined;
      const msgBuffer = new TextEncoder().encode(clean);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    async function sendCapiEvent(eventName, customData = {}, userData = {}, eventId, settings) {
      const pixelId = (settings?.metaPixelId || '').trim();
      const token = (settings?.metaCapiToken || '').trim();
      if (!pixelId || !token) return;

      try {
        const hashedUser = {
          client_user_agent: navigator.userAgent
        };
        if (userData.phone) {
          let ph = String(userData.phone).replace(/\D/g, '');
          if (ph.startsWith('01')) ph = '88' + ph;
          hashedUser.ph = [await sha256Hash(ph)];
        }
        if (userData.name) {
          hashedUser.fn = [await sha256Hash(userData.name)];
        }
        if (userData.city) {
          hashedUser.ct = [await sha256Hash(userData.city)];
        }
        hashedUser.country = [await sha256Hash('bd')];

        const payload = {
          data: [
            {
              event_name: eventName,
              event_time: Math.floor(Date.now() / 1000),
              action_source: 'website',
              event_id: eventId,
              event_source_url: window.location.href,
              user_data: hashedUser,
              custom_data: customData
            }
          ]
        };

        const testCode = (settings?.metaTestCode || '').trim();
        if (testCode) {
          payload.test_event_code = testCode;
        }

        await fetch(`https://graph.facebook.com/v19.0/${pixelId}/events?access_token=${encodeURIComponent(token)}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        console.warn('CAPI warning:', err);
      }
    }

    function trackMarketingEvent(eventName, customData = {}, userData = {}, settings) {
      const eventId = `${eventName.toLowerCase()}_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
      if (window.fbq && settings?.metaPixelId) {
        window.fbq('track', eventName, customData, { eventID: eventId });
      }
      sendCapiEvent(eventName, customData, userData, eventId, settings);
      if (window.gtag && settings?.ga4Id) {
        window.gtag('event', eventName, customData);
      }
    }
    // ============================================================================

      // Admin State

      const [adminTab, setAdminTab] = useState('dashboard');
      const [toastMsg, setToastMsg] = useState('');
      const [editingProduct, setEditingProduct] = useState(null);
      const [newTeamMember, setNewTeamMember] = useState({

        name: '',

      const showToast = (msg) => {
        setToastMsg(msg);

      // Hide Initial Preloader smoothly once Firebase/Cache data is ready
      useEffect(() => {
        if (isDataReady) {

          if (loader) loader.classList.add('hidden');
        }
      }, [isDataReady]);

      // Load Live Data from Firestore
      useEffect(() => {
        let unsubSettings = null;
        let unsubProducts = null;

        async function bootStore() {
          try {
            // Listen to Settings
            unsubSettings = onSnapshot(doc(db, 'smart_outfit_store', 'settings'), (snap) => {
              if (snap.exists()) {
                const data = { ...defaultSettings, ...snap.data() };
                setSettings(data);
                localStorage.setItem('so_v4_settings', JSON.stringify(data));
                if (data.faviconUrl) {
                  const fav = document.getElementById('dynamic-favicon');
                  if (fav) fav.href = data.faviconUrl;
                }
                if (data.brandName) {
                  document.title = `${data.brandName} | Premium Menswear`;
                }
                initTrackingScripts(data);

                // Trigger Promotional Popup if enabled and not closed in this session
                if (data.popupEnabled === true && data.popupImageUrl) {
                  const alreadyClosed = sessionStorage.getItem('so_popup_closed');
                  if (!alreadyClosed) {
                    setShowPromoPopup(true);
                  }
                } else {
                  setShowPromoPopup(false);
                }
              } else {
                initTrackingScripts(defaultSettings);
              }
              setIsDataReady(true);
            }, () => setIsDataReady(true));

            // Listen to Products
            unsubProducts = onSnapshot(doc(db, 'smart_outfit_store', 'products'), (snap) => {
              if (snap.exists()) {
                const list = snap.data().items || [];
                setProducts(list);
                localStorage.setItem('so_v4_products', JSON.stringify(list));
              }
            });

            // Load Analytics & Increment Visitor
            const anaRef = doc(db, 'smart_outfit_store', 'analytics');
            const anaSnap = await getDoc(anaRef);
            if (anaSnap.exists()) {
              const anaData = anaSnap.data();
              setAnalytics(anaData);
              if (!sessionStorage.getItem('so_visit_counted')) {
                sessionStorage.setItem('so_visit_counted', '1');
                await setDoc(anaRef, { ...anaData, totalVisitors: (anaData.totalVisitors || 0) + 1 }, { merge: true });
              }
            }
          } catch (err) {
            console.warn('Boot warning:', err);
            setIsDataReady(true);
          }
        }

        bootStore();

        const unsubAuth = onAuthStateChanged(auth, (user) => {
          setCurrentUser(user || null);
        });

        // Safety fallback to hide preloader within 1.2s on slow mobile networks
        const safetyTimer = setTimeout(() => setIsDataReady(true), 1200);

        return () => {
          if (unsubSettings) unsubSettings();
          if (unsubProducts) unsubProducts();
          unsubAuth();
          clearTimeout(safetyTimer);
        };
      }, []);

      // Load Orders when in Admin or Tracking
      const fetchAllOrders = async () => {
        try {
          const snap = await getDocs(collection(db, 'orders'));
          const list = [];
          snap.forEach(d => list.push({ id: d.id, ...d.data() }));
          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          setOrders(list);
          return list;
        } catch (err) {

          return [];

      useEffect(() => {

      // Check Admin Permission
      const adminAccess = useMemo(() => {
        if (!currentUser?.email) return null;
        const email = currentUser.email.toLowerCase();
        if (email === SUPER_ADMIN_EMAIL.toLowerCase() || email === (settings.adminEmail || '').toLowerCase()) {

        if (member) {

            role: member.rolePreset || 'Team Member',
            isSuper: false,
            tabs: member.tabs || ['orders'],
            canDelete: !!member.canDelete
          };
        }
        return null;
      }, [currentUser, settings]);

      // Filtered Products
      const filteredProducts = useMemo(() => {
        return products.filter(p => {
          const matchesCat = activeCategory === 'ALL' || p.mainCategory === activeCategory;
          const q = searchQuery.trim().toLowerCase();
          const name = (p.nameEn || p.name || '').toLowerCase();
          const sku = (p.sku || '').toLowerCase();
          const matchesSearch = !q || name.includes(q) || sku.includes(q);
          return matchesCat && matchesSearch;
        });
      }, [products, activeCategory, searchQuery]);

      // Helper to get product display price & image
      const getProductPrice = (p) => {
        const disc = Number(p.discountPrice);
        const reg = Number(p.regularPrice);
        return disc > 0 && disc < reg ? disc : reg;
      };

      const getProductImage = (p, colorIdx = 0) => {
        if (p.colors && p.colors[colorIdx]?.images?.[0]) return p.colors[colorIdx].images[0];
        if (p.colors && p.colors[0]?.images?.[0]) return p.colors[0].images[0];
        if (p.image) return p.image;
        return 'https://images.unsplash.com/photo-1617137984095-74e4e5e3613f?auto=format&fit=crop&w=600&q=80';
      };

      const openProductModal = (product) => {
        setSelectedProduct(product);
        setSelectedColorIdx(0);
        setSelectedSize('');
        setSizeError(false);

        const price = getProductPrice(product);
        trackMarketingEvent('ViewContent', {
          content_name: product.nameEn || product.name,
          content_ids: [String(product.id || product.sku)],
          content_type: 'product',
          value: price,
          currency: 'BDT'
        }, {}, settings);

      // Add to Cart / Buy Now with Strict English Size Check

        const availableSizes = product.sizeChart?.length
          ? product.sizeChart.map(s => s.size || s)
          : (product.sizes || ['M', 'L', 'XL', 'XXL']);

        if (availableSizes.length > 0 && !selectedSize) {
          setSizeError(true);
          showToast('Please select a size first');
          return;
        }

        const price = getProductPrice(product);
        const colorObj = product.colors?.[selectedColorIdx] || { name: 'Default' };
        const img = getProductImage(product, selectedColorIdx);
        const cartItemId = `${product.id}_${colorObj.name}_${selectedSize || 'Standard'}`;

        setCart(prev => {
          const existing = prev.find(item => item.cartItemId === cartItemId);
          if (existing) {
            return prev.map(item => item.cartItemId === cartItemId ? { ...item, qty: item.qty + 1 } : item);
          }
          return [...prev, {
            cartItemId,
            productId: product.id,
            sku: product.sku || '',
            name: product.nameEn || product.name,
            price,
            color: colorObj.name,
            size: selectedSize || 'Standard',
            image: img,
            qty: 1,
            freeDelivery: product.freeDelivery === true
          }];
        });

        // Update AddToCart Analytics + Meta Event
        trackMarketingEvent('AddToCart', {
          content_name: product.nameEn || product.name,
          content_ids: [String(product.id || product.sku)],
          content_type: 'product',
          value: price,
          currency: 'BDT'
        }, {}, settings);

        const newCount = (analytics.addToCartCount || 0) + 1;
        setAnalytics(prev => ({ ...prev, addToCartCount: newCount }));
        setDoc(doc(db, 'smart_outfit_store', 'analytics'), { addToCartCount: newCount }, { merge: true }).catch(() => {});

          setSelectedProduct(null);
          setIsCartOpen(true);

            value: price,
            currency: 'BDT'
          }, {}, settings);
        } else {
          showToast('Added to your shopping bag');
        }

        return cart.reduce((sum, item) => sum + (Number(item.price) * Number(item.qty)), 0);
      }, [cart]);

        return calculateDeliveryFee(cart, checkoutForm.zone, settings);

          showToast('Please enter a valid 11-digit mobile number');
          return;
        }

        setIsSubmittingOrder(true);
        try {
          const orderNum = Number(settings.nextOrderNumber) || 1001;
          const orderId = `${settings.orderPrefix || 'SO-'}${orderNum}`;
          const newOrder = {
            id: orderId,
            customerName: checkoutForm.name.trim(),
            phone: cleanPhone,
            address: checkoutForm.address.trim(),
            zone: checkoutForm.zone,
            note: checkoutForm.note.trim(),
            items: cart,
            subtotal: cartSubtotal,
            deliveryFee: deliveryFee,
            total: cartGrandTotal,
            status: 'Pending',
            createdAt: Date.now(),
            dateStr: new Date().toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' })
          };

          await setDoc(doc(db, 'orders', orderId), newOrder);
          await setDoc(doc(db, 'smart_outfit_store', 'settings'), {
            nextOrderNumber: orderNum + 1

          const newCheckoutCount = (analytics.checkoutCount || 0) + 1;
          await setDoc(doc(db, 'smart_outfit_store', 'analytics'), {
            checkoutCount: newCheckoutCount
          }, { merge: true });

            content_ids: cart.map(i => String(i.productId || i.sku)),
            content_type: 'product',
            value: cartGrandTotal,
            currency: 'BDT',
            num_items: cart.reduce((s, i) => s + i.qty, 0)

            name: newOrder.customerName,
            phone: newOrder.phone,
            city: newOrder.zone === 'inside' ? 'dhaka' : 'bangladesh'

          setCart([]);

            const phoneMatch = cleanQueryPhone.length >= 10 && String(o.phone || '').replace(/\D/g, '').endsWith(cleanQueryPhone.slice(-10));
            return idMatch || phoneMatch;

                  ${(settings.mainCategories || []).map(cat => html`
                    <button
                      onClick=${() => setActiveCategory(cat)}
                      class=${`px-3.5 py-1.5 text-xs font-bold uppercase tracking-wider whitespace-nowrap transition ${activeCategory === cat ? 'bg-espresso text-white' : 'text-gray-600 hover:text-espresso'}`}
                    >
                      ${cat}
                    </button>
                  `)}
                </div>
              </div>
            `}
          </header>

          <!-- VIEW: SIMPLE 1-BOX PARCEL TRACKING (100% English + Masked Privacy) -->
          ${view === 'track' ? html`
            <div class="flex-1 max-w-xl w-full mx-auto px-4 py-10">
              <div class="bg-white border border-borderWarm p-6 md:p-8 shadow-xs">
                <h2 class="text-lg font-extrabold uppercase tracking-wider text-terracotta mb-1">
                  Track Your Parcel
                </h2>
                <p class="text-xs text-gray-500 mb-6">
                  Enter your Order ID or 11-digit Mobile Number to view live delivery status.
                </p>

                <form onSubmit=${handleTrackParcel} class="space-y-4">
                  <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-gray-600 mb-2">
                      Order ID or Mobile Number *
                    </label>
                    <input
                      type="text"
                      value=${trackInput}
                      onInput=${e => setTrackInput(e.target.value)}
                      placeholder="e.g. SO-1001 or 017XXXXXXXX"
                      class="w-full border border-borderWarm p-3.5 bg-cream/40 font-semibold focus:outline-none focus:border-terracotta"
                    />
                  </div>
                  <button
                    type="submit"
                    disabled=${isTrackingLoading}
                    class="w-full bg-terracotta hover:bg-terracottaDark text-white font-bold py-3.5 uppercase text-xs tracking-widest transition"
                  >
                    ${isTrackingLoading ? 'CHECKING STATUS...' : 'TRACK PARCEL STATUS'}
                  </button>
                </form>

                ${trackedOrders !== null && html`
                  <div class="mt-6 pt-6 border-t border-borderWarm space-y-4">
                    ${trackedOrders.length === 0 ? html`
                      <p class="text-xs text-red-600 font-semibold text-center py-4">
                        No order found matching "${trackInput}". Please check your Order ID or Mobile Number.
                      </p>
                    ` : trackedOrders.map(ord => html`
                      <div class="border border-borderWarm p-4 bg-cream/40 space-y-2 text-xs">
                        <div class="flex items-center justify-between">
                          <span class="font-extrabold text-sm text-terracotta">${ord.id}</span>
                          <span class="px-2.5 py-1 bg-espresso text-white font-bold uppercase text-[10px] tracking-wider">
                            ${ord.status || 'Pending'}
                          </span>
                        </div>
                        <div class="text-gray-600 font-medium">
                          Customer: <strong class="text-espresso">${maskCustomerName(ord.customerName)}</strong> • Phone: <strong class="text-espresso">${maskPhoneNumber(ord.phone)}</strong>
                        </div>
                        <div class="text-gray-600">
                          Delivery Zone: ${ord.zone === 'outside' ? 'Outside Dhaka' : 'Inside Dhaka'} • Order Date: ${ord.dateStr || 'Recent'}
                        </div>
                        <div class="pt-2 border-t border-borderWarm/80 flex justify-between font-extrabold text-espresso">
                          <span>Items: ${(ord.items || []).reduce((s, i) => s + i.qty, 0)}</span>
                          <span>Total Payable: ৳${ord.total}</span>
                        </div>
                      </div>
                    `)}
                  </div>
                `}
              </div>
            </div>
          ` : html`
            <!-- VIEW: STOREFRONT -->
            <main class="flex-1">
              <!-- Hero Banner -->
              ${activeCategory === 'ALL' && !searchQuery && settings.heroBanners?.[0]?.image && html`
                <div class="relative bg-espresso overflow-hidden">
                  <img
                    src=${settings.heroBanners[0].image}
                    alt="Smart Outfit Collection"
                    class="w-full h-[260px] md:h-[420px] object-cover opacity-80"
                  />
                  <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent flex flex-col items-center justify-end text-center p-6 md:p-12">
                    <h1 class="text-white font-serif-brand text-2xl md:text-4xl font-bold tracking-wide max-w-2xl">
                      ${settings.heroBanners[0].title || 'TIMELESS MENSWEAR COLLECTION'}
                    </h1>
                    <p class="text-gray-200 text-xs md:text-sm mt-2 max-w-lg">
                      ${settings.heroBanners[0].subtitle || settings.tagline}
                    </p>
                  </div>
                </div>
              `}

              <!-- Product Grid Section -->
              <section class="max-w-7xl mx-auto px-4 py-6 md:py-10">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-6">
                  <div>
                    <h2 class="text-base md:text-lg font-extrabold uppercase tracking-wider">
                      ${activeCategory === 'ALL' ? 'Latest Arrivals' : activeCategory}
                    </h2>
                    <p class="text-xs text-gray-500">${filteredProducts.length} items available</p>
                  </div>
                  <div class="w-full sm:w-64">
                    <input
                      type="search"
                      value=${searchQuery}
                      onInput=${e => setSearchQuery(e.target.value)}
                      placeholder="Search product or SKU..."
                      class="w-full bg-white border border-borderWarm px-3.5 py-2 text-xs focus:outline-none focus:border-terracotta"
                    />
                  </div>
                </div>

                ${filteredProducts.length === 0 ? html`
                  <div class="bg-white border border-borderWarm p-12 text-center">
                    <p class="text-sm font-bold text-gray-500">No products found in this collection.</p>
                  </div>
                ` : html`
                  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3.5 md:gap-6">
                    ${filteredProducts.map(product => {
                      const price = getProductPrice(product);
                      const regPrice = Number(product.regularPrice);
                      const hasDiscount = regPrice > price;
                      return html`
                        <div
                          onClick=${() => openProductModal(product)}
                          class="group bg-white border border-borderWarm overflow-hidden flex flex-col cursor-pointer hover:shadow-md transition"
                        >
                          <div class="relative aspect-[3/4] bg-cream overflow-hidden">
                            <img
                              src=${getProductImage(product)}
                              alt=${product.nameEn || product.name}
                              loading="lazy"
                              class="w-full h-full object-cover group-hover:scale-105 transition duration-500"
                            />
                            ${hasDiscount && html`
                              <span class="absolute top-2.5 left-2.5 bg-terracotta text-white text-[10px] font-extrabold uppercase px-2 py-0.5 tracking-wider">
                                SALE
                              </span>
                            `}
                          </div>
                          <div class="p-3.5 flex-1 flex flex-col justify-between">
                            <div>
                              <div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">
                                ${product.mainCategory || 'MENSWEAR'}
                              </div>
                              <h3 class="font-bold text-xs md:text-sm text-espresso mt-0.5 line-clamp-2">
                                ${product.nameEn || product.name}
                              </h3>
                            </div>
                            <div class="mt-3 pt-2.5 border-t border-borderWarm flex items-center justify-between">
                              <div class="flex items-baseline gap-1.5">
                                <span class="font-extrabold text-sm md:text-base text-terracotta">৳${price}</span>
                                ${hasDiscount && html`
                                  <span class="text-[11px] text-gray-400 line-through">৳${regPrice}</span>
                                `}
                              </div>
                              <span class="text-[11px] font-extrabold uppercase text-espresso group-hover:text-terracotta">
                                Order →
                              </span>
                            </div>
                          </div>
                        </div>
                      `;
                    })}
                  </div>
                `}
              </section>
            </main>
          `}

          <!-- PRODUCT QUICK-VIEW & SIZE SELECTION MODAL (Mobile Optimized) -->
          ${selectedProduct && html`
            <div
              onClick=${() => setSelectedProduct(null)}
              class="fixed inset-0 z-40 bg-black/60 backdrop-blur-xs flex items-end md:items-center justify-center p-0 md:p-4"
            >
              <div
                onClick=${e => e.stopPropagation()}
                class="bg-white w-full max-w-2xl max-h-[90vh] overflow-y-auto border border-borderWarm grid grid-cols-1 md:grid-cols-2 relative"
              >
                <button
                  onClick=${() => setSelectedProduct(null)}
                  class="absolute top-3 right-3 z-10 w-8 h-8 rounded-full bg-espresso text-white font-bold text-sm flex items-center justify-center"
                >
                  ✕
                </button>

                <div class="bg-cream aspect-[3/4] md:aspect-auto">
                  <img
                    src=${getProductImage(selectedProduct, selectedColorIdx)}
                    alt=${selectedProduct.nameEn || selectedProduct.name}
                    class="w-full h-full object-cover"
                  />
                </div>

                <div class="p-5 md:p-6 flex flex-col justify-between space-y-4">
                  <div class="space-y-3">
                    <div class="text-[11px] font-bold text-gray-400 uppercase tracking-wider">
                      SKU: ${selectedProduct.sku || selectedProduct.id}
                    </div>
                    <h2 class="text-lg font-extrabold text-espresso">
                      ${selectedProduct.nameEn || selectedProduct.name}
                    </h2>
                    <div class="flex items-baseline gap-2">
                      <span class="text-xl font-extrabold text-terracotta">৳${getProductPrice(selectedProduct)}</span>
                      ${Number(selectedProduct.regularPrice) > getProductPrice(selectedProduct) && html`
                        <span class="text-xs text-gray-400 line-through">৳${selectedProduct.regularPrice}</span>
                      `}
                    </div>

                    ${selectedProduct.fabricSpecs && html`
                      <p class="text-xs text-gray-600 leading-relaxed pt-1">
                        ${selectedProduct.fabricSpecs}
                      </p>
                    `}

                    <!-- Size Selection (Clean English Alert) -->
                    <div class="pt-2">
                      <div class="flex items-center justify-between mb-2">
                        <span class="text-xs font-extrabold uppercase tracking-wider">Select Size *</span>
                        ${sizeError && !selectedSize && html`
                          <span class="text-xs font-bold text-red-600">Please select a size first</span>
                        `}
                      </div>
                      <div class="flex flex-wrap gap-2">
                        ${(selectedProduct.sizeChart?.length
                          ? selectedProduct.sizeChart.map(s => s.size || s)
                          : (selectedProduct.sizes || ['M', 'L', 'XL', 'XXL'])
                        ).map(sz => html`
                          <button
                            type="button"
                            onClick=${() => { setSelectedSize(sz); setSizeError(false); }}
                            class=${`min-w-[48px] py-2.5 px-3 text-xs font-extrabold uppercase border transition ${
                              selectedSize === sz
                                ? 'bg-espresso text-white border-espresso'
                                : sizeError
                                  ? 'border-red-500 bg-red-50 text-red-700'
                                  : 'border-borderWarm bg-cream/50 text-espresso hover:border-espresso'
                            }`}
                          >
                            ${sz}
                          </button>
                        `)}
                      </div>
                    </div>
                  </div>

                  <div class="pt-4 border-t border-borderWarm space-y-2.5">
                    <button
                      onClick=${() => handleAddToCart(selectedProduct, true)}
                      class="w-full bg-terracotta hover:bg-terracottaDark text-white font-extrabold py-3.5 text-xs uppercase tracking-widest transition"
                    >
                      ORDER NOW (CASH ON DELIVERY)
                    </button>
                    <button
                      onClick=${() => handleAddToCart(selectedProduct, false)}
                      class="w-full bg-espresso hover:bg-black text-white font-bold py-3 text-xs uppercase tracking-widest transition"
                    >
                      + ADD TO BAG
                    </button>
                  </div>
                </div>
              </div>
            </div>
          `}

          <!-- SLIDE-OVER SHOPPING BAG & CHECKOUT DRAWER (Strict Delivery Fee Applied) -->
          ${isCartOpen && html`
            <div
              onClick=${() => setIsCartOpen(false)}
              class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex justify-end"
            >
              <div
                onClick=${e => e.stopPropagation()}
                class="bg-white w-full max-w-md h-full flex flex-col justify-between overflow-y-auto p-5 md:p-6"
              >
                <div>
                  <div class="flex items-center justify-between pb-4 border-b border-borderWarm">
                    <h2 class="text-sm font-extrabold uppercase tracking-wider">Checkout & Order Summary</h2>
                    <button onClick=${() => setIsCartOpen(false)} class="text-sm font-bold px-2 py-1">✕</button>
                  </div>

                  ${cart.length === 0 ? html`
                    <div class="py-16 text-center space-y-3">
                      <p class="text-xs text-gray-500">Your shopping bag is currently empty.</p>
                      <button
                        onClick=${() => setIsCartOpen(false)}
                        class="bg-espresso text-white px-5 py-2.5 text-xs font-bold uppercase tracking-wider"
                      >
                        Continue Shopping
                      </button>
                    </div>
                  ` : html`
                    <div class="divide-y divide-borderWarm my-4">
                      ${cart.map(item => html`
                        <div class="py-3 flex gap-3 items-center">
                          <img src=${item.image} class="w-14 h-16 object-cover bg-cream flex-shrink-0" />
                          <div class="flex-1 min-w-0 text-xs">
                            <div class="font-bold text-espresso truncate">${item.name}</div>
                            <div class="text-gray-500">Size: ${item.size} • ৳${item.price} × ${item.qty}</div>
                            <div class="flex items-center gap-2 mt-1.5">
                              <button
                                onClick=${() => setCart(cart.map(i => i.cartItemId === item.cartItemId ? { ...i, qty: Math.max(1, i.qty - 1) } : i))}
                                class="w-6 h-6 border border-borderWarm font-bold"
                              >-</button>
                              <span class="font-bold">${item.qty}</span>
                              <button
                                onClick=${() => setCart(cart.map(i => i.cartItemId === item.cartItemId ? { ...i, qty: i.qty + 1 } : i))}
                                class="w-6 h-6 border border-borderWarm font-bold"
                              >+</button>
                              <button
                                onClick=${() => setCart(cart.filter(i => i.cartItemId !== item.cartItemId))}
                                class="ml-auto text-red-600 text-[11px] font-bold"
                              >Remove</button>
                            </div>
                          </div>
                        </div>
                      `)}
                    </div>

                    <form onSubmit=${handlePlaceOrder} class="space-y-3.5 pt-2 border-t border-borderWarm">
                      <div>
                        <label class="block text-[11px] font-bold uppercase mb-1">Full Name *</label>
                        <input
                          type="text"
                          required
                          value=${checkoutForm.name}
                          onInput=${e => setCheckoutForm({ ...checkoutForm, name: e.target.value })}
                          placeholder="Your Full Name"
                          class="w-full border border-borderWarm p-3 bg-cream/30"
                        />
                      </div>
                      <div>
                        <label class="block text-[11px] font-bold uppercase mb-1">11-Digit Mobile Number *</label>
                        <input
                          type="tel"
                          required
                          value=${checkoutForm.phone}
                          onInput=${e => setCheckoutForm({ ...checkoutForm, phone: e.target.value })}
                          placeholder="01XXXXXXXXX"
                          class="w-full border border-borderWarm p-3 bg-cream/30"
                        />
                      </div>
                      <div>
                        <label class="block text-[11px] font-bold uppercase mb-1">Delivery Area *</label>
                        <div class="grid grid-cols-2 gap-2.5">
                          <button
                            type="button"
                            onClick=${() => setCheckoutForm({ ...checkoutForm, zone: 'inside' })}
                            class=${`p-2.5 text-xs font-bold border text-left ${checkoutForm.zone === 'inside' ? 'border-terracotta bg-terracotta/10 text-terracotta' : 'border-borderWarm'}`}
                          >
                            Inside Dhaka (৳${Number(settings.insideDhaka) || 70})
                          </button>
                          <button
                            type="button"
                            onClick=${() => setCheckoutForm({ ...checkoutForm, zone: 'outside' })}
                            class=${`p-2.5 text-xs font-bold border text-left ${checkoutForm.zone === 'outside' ? 'border-terracotta bg-terracotta/10 text-terracotta' : 'border-borderWarm'}`}
                          >
                            Outside Dhaka (৳${Number(settings.outsideDhaka) || 130})
                          </button>
                        </div>
                      </div>
                      <div>
                        <label class="block text-[11px] font-bold uppercase mb-1">Full Delivery Address *</label>
                        <textarea
                          rows="2"
                          required
                          value=${checkoutForm.address}
                          onInput=${e => setCheckoutForm({ ...checkoutForm, address: e.target.value })}
                          placeholder="House, Road, Area, Thana & District"
                          class="w-full border border-borderWarm p-3 bg-cream/30"
                        ></textarea>
                      </div>

                      <div class="bg-cream p-3.5 space-y-1.5 text-xs border border-borderWarm">
                        <div class="flex justify-between">
                          <span class="text-gray-600">Subtotal</span>
                          <span class="font-bold">৳${cartSubtotal}</span>
                        </div>
                        <div class="flex justify-between">
                          <span class="text-gray-600">Delivery Charge</span>
                          <span class="font-bold">
                            ${deliveryFee === 0 ? 'FREE' : `৳${deliveryFee}`}
                          </span>
                        </div>
                        <div class="flex justify-between pt-2 border-t border-borderWarm text-sm font-extrabold text-terracotta">
                          <span>Total Payable (COD)</span>
                          <span>৳${cartGrandTotal}</span>
                        </div>
                      </div>

                      <button
                        type="submit"
                        disabled=${isSubmittingOrder}
                        class="w-full bg-terracotta hover:bg-terracottaDark text-white font-extrabold py-4 text-xs uppercase tracking-widest transition"
                      >
                        ${isSubmittingOrder ? 'CONFIRMING ORDER...' : `CONFIRM ORDER — ৳${cartGrandTotal}`}
                      </button>
                    </form>
                  `}
                </div>
              </div>
            </div>
          `}

          <!-- ORDER CONFIRMATION MODAL -->
          ${orderSuccess && html`
            <div class="fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
              <div class="bg-white border border-borderWarm p-6 md:p-8 max-w-md w-full text-center space-y-4">
                <div class="w-12 h-12 rounded-full bg-green-800 text-white flex items-center justify-center mx-auto text-xl font-bold">
                  ✓
                </div>
                <h2 class="text-lg font-extrabold uppercase text-espresso">Thank You For Your Order!</h2>
                <p class="text-xs text-gray-600">
                  Your Order ID is <strong class="text-terracotta text-sm">${orderSuccess.id}</strong>. We will contact you shortly to dispatch your parcel.
                </p>
                <div class="bg-cream p-3.5 text-xs text-left space-y-1 border border-borderWarm">
                  <div><strong>Customer:</strong> ${orderSuccess.customerName}</div>
                  <div><strong>Phone:</strong> ${orderSuccess.phone}</div>
                  <div><strong>Total Payable:</strong> ৳${orderSuccess.total} (Cash on Delivery)</div>
                </div>
                <button
                  onClick=${() => setOrderSuccess(null)}
                  class="w-full bg-espresso text-white py-3 text-xs font-bold uppercase tracking-wider"
                >
                  Continue Shopping
                </button>
              </div>
            </div>
          `}

          <!-- Clean Footer with Subtle Admin Access Link -->
          <footer class="bg-espresso text-cream mt-12 py-10 px-4 border-t border-borderWarm">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between gap-6 text-xs">
              <div class="space-y-2 max-w-sm">
                <div class="font-extrabold text-sm tracking-wider uppercase">${settings.brandName}</div>
                <p class="text-gray-400 leading-relaxed">${settings.footerBio}</p>
              </div>
              <div class="space-y-1.5 text-gray-300">
                <div class="font-bold uppercase text-white">Customer Care</div>
                <div>Helpline: ${settings.helpline}</div>
                <div>Location: ${settings.addressEn}</div>
                <div class="pt-2 flex gap-4">
                  <button onClick=${() => setView('track')} class="underline hover:text-white">Track Order</button>
                  <button onClick=${() => setView(currentUser ? 'admin' : 'admin-login')} class="text-gray-500 hover:text-gray-300">
                    Admin Portal
                  </button>
                </div>
              </div>
            </div>
          </footer>
        </div>
      `;
    }

    render(html`<${App} />`, document.getElementById('app'));
  </script>
</body>
</html>
