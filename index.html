    const compressImageToWebP = (file, maxWidth = 800, quality = 0.8) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ratio = img.width > maxWidth ? maxWidth / img.width : 1;
            canvas.width = img.width * ratio;
            canvas.height = img.height * ratio;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/webp", quality));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

              nameBn: selectedProduct.nameBn,
              color: colorObj.name,
              size: selectedSize,
              price: Number(selectedProduct.discountPrice),
              freeDelivery: Boolean(selectedProduct.freeDelivery),
              image: colorObj.image,
              qty: 1
            });
          }
        }

        if (directBuy) {

          setConfirmedOrder(null);
          setView("checkout");

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csvContent));

                          <p class="font-extrabold text-[#822B17] mt-0.5">৳${item.price} × ${item.qty}</p>
                        </div>
                        <button onClick=${() => setCart(cart.filter((_, idx) => idx !== i))} class="text-red-500 font-bold px-2">✕</button>
                      </div>
                    `)}
                  </div>
                </div>
                ${cart.length > 0 && html`
                  <div class="border-t border-current/15 pt-4">
                    <div class="flex justify-between font-extrabold text-base mb-3">
                      <span>${t("Subtotal", "মোট")}</span>
                      <span>৳${subtotal}</span>
                    </div>
                    <button onClick=${() => { setCartOpen(false); setConfirmedOrder(null); setView("checkout"); }} class="w-full py-3.5 rounded-xl bg-[#822B17] text-white font-bold text-sm">
                      ${t("Proceed to Checkout", "চেকআউট করুন")}
                    </button>
                  </div>
                `}
              </div>
            </div>
          `}

          <a
            href="https://wa.me/${settings.whatsapp}"
            target="_blank"
            rel="noreferrer"
            class="no-print fixed bottom-20 md:bottom-6 right-4 z-40 w-12 h-12 rounded-full bg-[#168A45] text-white shadow-xl flex items-center justify-center hover:scale-105 transition"
          >
            💬
          </a>
        </div>
      `;
    }

    render(html`<${SmartOutfitApp} />`, document.getElementById("root"));
  </script>
</body>
</html>
