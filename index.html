    // Client-side WebP Image Compressor for Direct File Uploads
    const compressImageToWebP = (file, maxWidth = 900, quality = 0.8) => {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const ratio = img.width > maxWidth ? maxWidth / img.width : 1;
            canvas.width = img.width * ratio;
            canvas.height = img.height * ratio;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/webp", quality));
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    };

                sku: selectedProduct.sku,
                nameEn: selectedProduct.nameEn,
                nameBn: selectedProduct.nameBn || selectedProduct.nameEn,
                color: colorObj.name,
                size: row.size,
                price: Number(selectedProduct.discountPrice),
                freeDelivery: Boolean(selectedProduct.freeDelivery),
                image: colorObj.image,
                qty: 1
              });
            }
          });
        } else {
          const colorObj = selectedProduct.colors[selectedColorIdx] || selectedProduct.colors[0];
          const key = `${selectedProduct.id}-${colorObj.name}-${selectedSize}`;
          const idx = updatedCart.findIndex(item => item.key === key);
          if (idx > -1) {
            updatedCart[idx].qty += 1;
          } else {
            updatedCart.push({
              key,
              productId: selectedProduct.id,
              sku: selectedProduct.sku,
              nameEn: selectedProduct.nameEn,
              nameBn: selectedProduct.nameBn || selectedProduct.nameEn,
              color: colorObj.name,
              size: selectedSize,
              price: Number(selectedProduct.discountPrice),
              freeDelivery: Boolean(selectedProduct.freeDelivery),
              image: colorObj.image,
              qty: 1
            });
          }
        }

        setCart(updatedCart);
        if (directBuy) {
          setCartOpen(false);
          setConfirmedOrder(null);
          setView("checkout");
          window.scrollTo({ top: 0, behavior: "smooth" });
        } else {
          notify(t("Added to Bag", "ব্যাগে যুক্ত হয়েছে"));
          setCartOpen(true);
        }
      };

      // Delivery & Totals Calculation
      const subtotal = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      const totalItemsCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const hasProductFreeDelivery = cart.some(i => i.freeDelivery);
      const qualifiesMinSpend = settings.enableMinSpendRule && subtotal >= Number(settings.minSpendFreeDelivery);
      const isFreeDelivery = settings.globalFreeDelivery || hasProductFreeDelivery || qualifiesMinSpend || cart.length === 0;

      const deliveryCharge = isFreeDelivery
        ? 0
        : customerForm.zone === "inside"
        ? Number(settings.insideDhaka)
        : Number(settings.outsideDhaka);

      const grandTotal = Math.max(0, subtotal + deliveryCharge);

      // Submit Order + Auto Email Notification
      const submitOrder = async (e) => {
        e.preventDefault();
        if (!customerForm.name || !customerForm.phone || !customerForm.address || cart.length === 0) return;

        const now = new Date();
        const yearMonth = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}`;
        const orderId = `SO-${Math.floor(1000 + Math.random() * 9000)}`;

        const newOrder = {
          orderId,
          createdAt: now.toISOString(),
          dateFormatted: now.toLocaleDateString("en-GB") + " " + now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          yearMonth,
          customer: { ...customerForm },
          items: [...cart],
          subtotal,
          deliveryCharge,
          grandTotal,
          status: "Pending"
        };

        // 1. Save to LocalStorage & Firestore
        const updatedOrders = [newOrder, ...orders];
        setOrders(updatedOrders);
        try { localStorage.setItem("so_v3_orders", JSON.stringify(updatedOrders)); } catch {}
        if (db) {
          db.collection("orders").doc(orderId).set(newOrder).catch(() => {});
        }

        // 2. Remove from Incomplete Orders
        const cleanAbd = abandonedCarts.filter(a => a.phone !== customerForm.phone);
        setAbandonedCarts(cleanAbd);
        syncData("so_v3_abandoned", cleanAbd, "abandoned");

        // 3. Send Automatic Order Confirmation Email (Customer + Admin)
        if (settings.emailWebhookUrl) {
          fetch(settings.emailWebhookUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              ...newOrder,
              brandName: settings.brandName,
              adminEmail: settings.adminEmail,
              customerEmail: customerForm.email
            })
          }).catch(() => {});
        } else if (settings.adminEmail) {
          // Zero-config fallback via FormSubmit AJAX API if Admin Email is set
          fetch(`https://formsubmit.co/ajax/${settings.adminEmail}`, {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({
              _subject: `New Order ${orderId} - ${settings.brandName}`,
              Order_ID: orderId,
              Customer: customerForm.name,
              Phone: customerForm.phone,
              Email: customerForm.email || "N/A",
              Address: customerForm.address,
              Items: cart.map(i => `${i.nameEn} (${i.color} / Size: ${i.size}) x${i.qty}`).join(" | "),
              Total_Payable: `BDT ${grandTotal}`
            })
          }).catch(() => {});
        }

        setConfirmedOrder(newOrder);
        setCart([]);
        notify(t("Order Confirmed", "অর্ডার কনফার্ম হয়েছে"));
      };

      // Direct 1-Click PDF Invoice Download (No Browser Print Dialog)
      const downloadInvoiceDirect = (orderToDownload) => {
        const element = document.getElementById("invoice-card");
        if (!element) return;
        setDownloadingPdf(true);

        if (window.html2pdf) {
          const opt = {
            margin: 10,
            filename: `Smart-Outfit-Invoice-${orderToDownload.orderId}.pdf`,
            image: { type: "jpeg", quality: 0.98 },
            html2canvas: { scale: 2, useCORS: true },
            jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
          };
          window.html2pdf().set(opt).from(element).save().then(() => {
            setDownloadingPdf(false);
            notify(t("Invoice Downloaded", "ইনভয়েস ডাউনলোড হয়েছে"));
          }).catch(() => setDownloadingPdf(false));
        } else {
          setDownloadingPdf(false);
        }
      };

      // Admin Order Status Update
      const handleOrderStatusChange = (orderId, newStatus) => {

        setOrders(updated);
        try { localStorage.setItem("so_v3_orders", JSON.stringify(updated)); } catch {}

        notify(`Status: ${newStatus}`);

      // Export Orders to Excel/CSV
      const downloadOrdersCSV = (listToExport) => {
        const headers = ["OrderID", "Date", "CustomerName", "Phone", "Email", "Address", "Items", "Total_BDT", "Status"];
        const rows = listToExport.map(o => [
          o.orderId,
          o.dateFormatted,
          `"${o.customer.name}"`,
          o.customer.phone,
          o.customer.email || "",
          `"${o.customer.address.replace(/"/g, '""')}"`,

          o.grandTotal,
          o.status

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(r => r.join(","))].join("\n");
        const link = document.createElement("a");
        link.setAttribute("href", encodeURI(csvContent));
        link.setAttribute("download", `SMART_OUTFIT_ORDERS_${monthFilter}.csv`);

      const filteredProducts = useMemo(() => {

              <!-- TAB 1: DASHBOARD & MONTHLY ACCOUNTING -->
              ${adminTab === "dashboard" && html`

                      <button type="submit" class="w-full mt-4 py-3.5 bg-[#111111] text-white text-xs font-bold uppercase tracking-widest hover:bg-neutral-800 transition">
                        ${t("Confirm Order", "অর্ডার কনফার্ম করুন")}
                      </button>
                    </div>
                  </div>
                </form>
              `}
            </div>
          `}

          <!-- ===================================================================== -->
          <!-- VIEW 4: ORDER TRACKING & WISHLIST                                     -->
          <!-- ===================================================================== -->
          ${view === "track" && html`
            <div class="max-w-xl mx-auto px-4 py-12 flex-1 w-full">
              <h2 class="text-lg font-bold uppercase tracking-wide mb-2">${t("Track Your Order", "অর্ডার ট্র্যাক করুন")}</h2>
              <input value=${trackInput} onInput=${e => setTrackInput(e.target.value)} placeholder="Enter Mobile Number or Order ID (e.g. SO-1234)" class="w-full p-3.5 border border-neutral-300 text-xs outline-none focus:border-black mb-6" />
              <div class="space-y-4">
                ${orders.filter(o => trackInput && (o.orderId.toLowerCase() === trackInput.toLowerCase() || o.customer.phone.includes(trackInput))).map(ord => html`
                  <div key=${ord.orderId} class="p-5 border border-neutral-300 text-xs space-y-2">
                    <div class="flex justify-between font-bold text-sm">
                      <span>${ord.orderId}</span>
                      <span class="px-2.5 py-0.5 bg-[#111111] text-white text-xs">${ord.status}</span>
                    </div>
                    <p>${ord.customer.name} • ${ord.customer.phone}</p>
                    <p class="font-bold">Total Payable: ৳ ${ord.grandTotal}</p>
                  </div>
                `)}
              </div>
            </div>
          `}

          ${view === "wishlist" && html`
            <div class="max-w-5xl mx-auto px-4 py-12 flex-1 w-full">
              <h2 class="text-lg font-bold uppercase tracking-wide mb-6">My Wishlist (${wishlist.length})</h2>
              ${wishlist.length === 0 ? html`<p class="text-xs text-neutral-500">No items saved in wishlist yet.</p>` : html`
                <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
                  ${products.filter(p => wishlist.includes(p.id)).map(prod => html`
                    <div key=${prod.id} onClick=${() => openProductPage(prod)} class="cursor-pointer">
                      <img src=${prod.colors[0]?.image} class="aspect-[3/4] object-cover mb-2" />
                      <h3 class="text-xs font-medium">${prod.nameEn}</h3>
                      <p class="text-xs font-bold mt-0.5">৳ ${prod.discountPrice}</p>
                    </div>
                  `)}
                </div>
              `}
            </div>
          `}

          <!-- ===================================================================== -->
          <!-- SLIDE-OUT SHOPPING BAG DRAWER                                         -->
          <!-- ===================================================================== -->
          ${cartOpen && html`
            <div class="fixed inset-0 z-50 bg-black/50 flex justify-end">
              <div class="w-full max-w-sm bg-white h-full p-6 flex flex-col justify-between text-[#111111]">
                <div>
                  <div class="flex justify-between items-center border-b border-neutral-200 pb-4">
                    <h3 class="font-bold text-sm uppercase tracking-wider">Shopping Bag (${totalItemsCount})</h3>
                    <button onClick=${() => setCartOpen(false)}><${IconClose}/></button>
                  </div>
                  <div class="mt-4 space-y-4 max-h-[65vh] overflow-y-auto">
                    ${cart.length === 0 ? html`<p class="text-xs text-neutral-400 py-12 text-center">Your bag is empty.</p>` : cart.map((item, i) => html`
                      <div key=${item.key} class="flex gap-3 items-center border-b border-neutral-100 pb-3 text-xs">
                        <img src=${item.image} class="w-14 h-18 object-cover bg-neutral-100" />
                        <div class="flex-1 min-w-0">
                          <p class="font-semibold truncate">${item.nameEn}</p>
                          <p class="text-neutral-500">${item.color} | Size: ${item.size}</p>
                          <p class="font-bold mt-1">৳ ${item.price} × ${item.qty}</p>
                        </div>
                        <button onClick=${() => setCart(cart.filter((_, idx) => idx !== i))} class="text-neutral-400 hover:text-black px-1">✕</button>
                      </div>
                    `)}
                  </div>
                </div>
                ${cart.length > 0 && html`
                  <div class="border-t border-neutral-200 pt-4">
                    <div class="flex justify-between font-bold text-sm mb-4">
                      <span>Subtotal</span>
                      <span>৳ ${subtotal}</span>
                    </div>
                    <button onClick=${() => { setCartOpen(false); setConfirmedOrder(null); setView("checkout"); }} class="w-full py-3.5 bg-[#111111] text-white text-xs font-bold uppercase tracking-widest">
                      Proceed to Checkout
                    </button>
                  </div>
                `}
              </div>
            </div>
          `}

          <!-- ===================================================================== -->
          <!-- ULTRA-CLEAN 3-COLUMN DARK CHARCOAL FOOTER (FABRILIFE STYLE)           -->
          <!-- ===================================================================== -->
          <footer class="mt-16 bg-[#333333] text-neutral-300 text-xs">
            <div class="max-w-6xl mx-auto px-4 sm:px-6 py-12 grid grid-cols-1 md:grid-cols-3 gap-10">
              
              <!-- Column 1: Logo & Essential Links -->
              <div class="space-y-3">
                <h3 class="text-white font-extrabold text-base tracking-wider uppercase">${settings.brandName}</h3>
                <ul class="space-y-2 text-neutral-300">
                  <li><button onClick=${() => setView("store")} class="hover:text-white">About ${settings.brandName}</button></li>
                  <li><button onClick=${() => setView("track")} class="hover:text-white">Cancellation & Return Policy</button></li>
                  <li><button onClick=${() => setView("store")} class="hover:text-white">Terms & Privacy Policy</button></li>
                  <li><button onClick=${() => setView("adminLogin")} class="text-neutral-400 hover:text-white">Admin</button></li>
                </ul>
              </div>

              <!-- Column 2: Customer Care & Track -->
              <div class="space-y-2.5">
                <p class="text-white font-bold uppercase tracking-wider">FOR ANY HELP YOU MAY CALL US AT</p>
                <p class="text-sm font-semibold text-white">${settings.helpline}</p>
                <p class="text-neutral-400">Customer Service (10:00 AM - 10:00 PM)</p>
                <button onClick=${() => { setView("track"); window.scrollTo({ top: 0, behavior: "smooth" }); }} class="pt-1 inline-block text-white underline">
                  Track your order or request size exchange →
                </button>
              </div>

              <!-- Column 3: Follow Us -->
              <div class="space-y-3">
                <p class="text-white font-bold uppercase tracking-wider">FOLLOW US</p>
                <p class="text-neutral-400">Stay updated on our latest arrivals and exclusive offers.</p>
                <div class="flex items-center gap-4 pt-1 text-white font-bold">
                  <a href=${settings.facebookUrl} target="_blank" rel="noreferrer" class="hover:opacity-75">Facebook</a>
                  <a href=${settings.instagramUrl} target="_blank" rel="noreferrer" class="hover:opacity-75">Instagram</a>
                  <a href=${settings.youtubeUrl} target="_blank" rel="noreferrer" class="hover:opacity-75">YouTube</a>
                </div>
              </div>
            </div>

            <!-- White Copyright Bottom Bar -->
            <div class="bg-white text-neutral-500 py-4 px-4 text-center text-[11px] border-t border-neutral-200">
              Copyright © 2026 ${settings.brandName}. All Rights Reserved.
            </div>
          </footer>

          <!-- CLEAN SOLID FLOATING MESSAGE BUTTON (FABRILIFE STYLE) -->
          <a
            href="https://wa.me/${settings.whatsapp}"
            target="_blank"
            rel="noreferrer"
            class="fixed bottom-6 right-6 z-40 w-12 h-12 rounded-full bg-[#111111] text-white shadow-lg flex items-center justify-center hover:scale-105 transition"
            title="Chat with us"
          >
            <${IconChat}/>
          </a>
        </div>
      `;
    }

    render(html`<${SmartOutfitApp} />`, document.getElementById("root"));
  </script>
</body>
</html>
